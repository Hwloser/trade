# 美股每日哨兵 — dagu DAG
# 依赖结构:
#     us-kline-sync ──┐
#     edgar-8k ───────┤
#     edgar-form4 ────┼──▶ sentinel-report
#     us-news ────────┘
#
# 输入层四条腿彼此独立、并行跑；报告等它们全部落盘后渲染。
# 安装:见 deployment/cron/README.md
name: us-daily
description: "美股哨兵:K线 + EDGAR(8-K/Form 4) + 英文新闻 → 晨报"

# 美股 16:00 ET 收盘 = 日本时间次日 05:00/06:00(夏令时切换)。
# 06:30 JST 起跑,收盘后半小时,数据已就绪,你起床就能看。
# 周二到周六:对应美股的周一到周五。
schedule: "30 6 * * 2-6"

maxActiveRuns: 1

env:
  - PROJ: /home/peng/PROGRAM/GitHub/trade
  # 美股交易日 = 昨天(日本时间已跨日)
  - USDATE: "`date -d yesterday +%Y-%m-%d`"

steps:
  # ── 输入层(并行)───────────────────────────────────────────
  - name: us-kline-sync
    executor:
      type: ssh2
      config:
        host: server
    command: cd $PROJ && ./trade py data kline sync --mode incremental --provider yfinance --symbols-file config/us_universe.txt

  - name: edgar-8k
    executor:
      type: ssh2
      config:
        host: server
    command: cd $PROJ && ./trade py data edgar sync --start $USDATE

  - name: edgar-form4
    executor:
      type: ssh2
      config:
        host: server
    command: cd $PROJ && ./trade py data edgar form4 --start $USDATE --universe-file config/us_universe.txt

  - name: us-news
    executor:
      type: ssh2
      config:
        host: server
    command: cd $PROJ && ./trade py data sentiment --rss-feeds catalog:us_public --market us

  # ── 报告层(等四条输入腿全部完成)────────────────────────────
  - name: sentinel-report
    executor:
      type: ssh2
      config:
        host: server
    command: cd $PROJ && ./trade py show us-sentinel --date $USDATE
    depends:
      - us-kline-sync
      - edgar-8k
      - edgar-form4
      - us-news
