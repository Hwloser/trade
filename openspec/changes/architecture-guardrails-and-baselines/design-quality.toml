schema_version = 1
policy_version = "v1"

[[impacts]]
id = "public_contract"
applies = true
reason = "The source-only architecture baseline validator exposes a reviewed developer-tool contract for future child changes, while Task 2.3 separately owns any trade dev check contributor, planner, scope, or report integration and no end-user runtime interface changes."

[[impacts]]
id = "persistent_write"
applies = false
reason = "The checker only parses repository source text and temporary test fixtures; it neither opens nor writes databases, artifacts, manifests, or durable runtime state."

[[impacts]]
id = "schema_migration"
applies = true
reason = "The source-only baseline governs legacy schema bootstrap, alteration, and transform provenance plus the compatibility prerequisites that future owner migrations must satisfy, without executing or authorizing a runtime migration in this child."

[[impacts]]
id = "point_in_time"
applies = false
reason = "No dataset, snapshot, clock, forecast, label, research result, or point-in-time resolver behavior is introduced or changed by this source-only guardrail."

[[impacts]]
id = "predictive_model"
applies = false
reason = "The child has no recommendation, ranking, model fitting, study result, calibration, or decision behavior; it only protects future module boundaries."

[[impacts]]
id = "external_event_data"
applies = false
reason = "The checker performs no provider interaction, capture, import, replay, news ingestion, payload processing, or external network access."

[[impacts]]
id = "runtime_concurrency"
applies = true
reason = "The governed change plans Task 2.3 quality-executor integration with bounded batches and prerequisite ordering. The current Task 2.1 implementation is read-only and has no quality-executor lifecycle, while its bounded Git-index subprocess is explicitly described below."

[evidence.contract]
contract = "The changed developer-facing contract is the source-only architecture baseline validator: it reports deterministic findings for malformed, stale, unsafe, incomplete, or non-authorizing declarations and returns no partial warehouse-producer inventory on failure. Task 2.3 separately owns any trade dev check plan/report JSON envelope, ScopeSelection metadata, partial-scope policy, or contributor registration."
consumers = "Repository developers and child OpenSpec implementers run the validator before declaring a legacy source fact or prospective table binding. Existing CLI, HTTP, Web, SDK, notebook, scheduler, event, database, artifact, native runtime, and trade dev check plan/report consumers remain unchanged by Task 2.1."
compatibility = "Existing runtime and developer command behavior remains unchanged. Candidate/deferred legacy records remain non-authorizing, approved bindings are table-only and source-verified, and no source, reader, interface, or quality-runner integration moves in this child."
migration = "The first target files arrive only in kernel-and-public-contracts or later child changes, each with its own compatibility evidence. The baseline records candidate/deferred facts and bounded CLI/HTTP/OpenAPI/SSE source inventory rather than moving source, readers, interface behavior, or quality-runner behavior."
rollback = "Remove the isolated validator, baseline metadata, and focused tests to return to the prior source-audit state; Task 2.1 adds no contributor, planner, quality-runner metadata, runtime interface, durable state, schema, or data artifact requiring restoration."

[evidence.storage]
authoritative_writer = "This source-only child has no runtime durable writer: existing TradeDB, pipeline databases, catalog SQLite projection, and Parquet owners remain unchanged. A future Context migration becomes authoritative only after its child names one repository writer and passes its own reviewed ownership proof."
idempotency_key = "The guard has no write retry path. Future table migrations must use a stable migration-generation plus source-record or immutable-artifact identity, while the baseline preserves the reviewed source literal and required child for that obligation."
concurrency_control = "The guard performs bounded read-only source inspection only. Future schema work must use the owning Context transaction or migration-leader lock and retain compatible-reader fencing; this child neither opens a database nor coordinates runtime writers."
staging_validation = "Baseline and guard changes validate only repository-confined source evidence in temporary fixtures. A future migration must stage a copy or additive generation, verify rows and immutable artifact references, and reconcile before any reader-visible cutover."
atomic_visibility = "Runtime state remains unchanged in this child. Later owner migrations must make a schema generation visible only through their local transaction or generation-stamped compatibility pointer after validation; candidate, deferred, and dynamic-limitation records remain non-authorizing."
crash_windows = "A failed source-only validation leaves no durable state. Future migration children must retain checkpoints and a recoverable prior generation so interruption before or after cutover can be diagnosed and resumed without publishing mixed ownership."
corrupt_predecessor = "The guard reports malformed, missing, stale, or unsafe evidence as an explicit failure and never repairs it. Future migrations must quarantine or restore a verified predecessor rather than accepting corrupt rows, pointers, manifests, or artifacts."
partial_results = "A baseline validation returns ordered findings and no partial success. Future multi-table or artifact migration work must keep incomplete reconciliation or backfill explicit and must not publish a partially migrated reader surface."
reader_consistency = "Existing SQLite, Parquet, catalog, CLI, HTTP, Web, SDK, notebook, scheduler, and event readers remain unchanged. Future Context readers must use compatibility adapters during the migration window; this guard only records source definitions and blocks stale declarations."
backup_hash_verification = "Runtime data is untouched in this child. Future migration rehearsals must use temporary-root copies and verify row counts, durable artifact digests, and compatibility-reader results against a preserved prior generation."
small_sample_verification = "Focused temporary repository fixtures mutate provenance roles, dynamic SQL limitations, Capture-risk semantics, adapter-local proof, and evidence budgets. Future data migrations require their own temporary-root small-sample backfill and rollback rehearsal."
rollback = "Revert the validator, baseline metadata, and focused fixtures as one developer-tooling unit before any owner migration consumes the facts. There is no database, artifact, manifest, pointer, or runtime reader state to restore."
audit_trail = "The reviewed baseline, OpenSpec evidence, deterministic guard findings, source path, line, literal, role, required child, and git history form the audit trail. It records no provider payload, credential, runtime row, or durable migration receipt."

[evidence.migration]
compatibility_modes = ["backward", "forward"]
dual_read_write = true

[evidence.migration.versioning]
strategy = "additive_version"
old_version_preserved = true

[evidence.migration.backfill]
mode = "idempotent_replay"
destructive = false
checkpointed = true

[evidence.migration.cutover]
strategy = "dual_read_compare"
readiness_gate = true

[evidence.migration.rollback]
supported = true
restore_source = "previous_generation"

[evidence.migration.legacy_retirement]
after_compatibility_window = true
minimum_window_days = 30

[evidence.concurrency]
ownership = "Task 2.1 owns deterministic, in-process source-only baseline validation and bounded producer discovery. Its internal Git-index subprocess has bounded timeout and cleanup, but Task 2.1 has no scheduler, worker, queue, quality-executor, or mutable runtime state. Task 2.3 separately owns any ScopeSelection, planner, contributor, executor, or partial-scope behavior."
bound = "The validator bounds descriptor-confined evidence, prospective approved-binding proofs, and producer discovery: 512 evidence sources, 8 MiB aggregate evidence, 1 MiB per evidence source, 256 source literals/64 KiB literal bytes per source, 256 callable proof operations/64 KiB retained proof SQL per callable, 250,000 AST nodes/512 AST depth per proof callable, 1,024 raw producer records/128 KiB raw path bytes, 512 included paths/64 KiB included path bytes, 1 MiB per producer source, and 32 MiB aggregate producer source. Aggregate proof summary/operation/retained-SQL limits and callable indexing are required before more than eight distinct approved proof callables or a second resource-family authorization."
ordering = "Evidence is read through no-follow descriptors, transformed once per source, and validated in deterministic baseline order before producer discovery. A source failure returns ordered findings and no producer inventory; no concurrent batch ordering is introduced."
atomicity = "One validation invocation reads immutable repository source text and returns one deterministic report. It creates no database, artifact, cache, queue, durable state, or application-runtime process transition; its bounded internal Git-index subprocess exists only for discovery and is cleaned up before return."
timeout_cancellation = "Task 2.1 bounds and cleans up only its internal Git-index subprocess; it has no retry, worker, or quality-executor lifecycle. Descriptor, source-byte, token, literal, proof-AST, and result ceilings fail closed; Task 2.3 must add explicit executor timeout/cancellation semantics before it invokes the validator through the quality executor."
backpressure = "Source and result ceilings stop oversized repository input before unbounded parsing or inventory growth. There is no queue or worker backpressure in Task 2.1."
partial_failure = "Malformed, unsafe, missing, stale, or over-budget evidence returns deterministic findings and an empty producer inventory. No partial baseline or producer result is accepted."
capacity_validation = "Focused tests cover descriptor safety, aggregate and per-source evidence budgets, literal count/byte refusal before matcher construction, branch/loop/exception/comprehension and nested-with proof refusal, first-positional SQL-only admission, mutable reader/compatibility and transaction-read rejection, token-aware quoted-identifier pseudo-read rejection, transaction root/alias and dynamic namespace rebinding refusal, wildcard/module-namespace/dynamic callable rebind refusal including definition-time class/default/decorator/base/metaclass expressions, closed v1 baseline schema and non-table authorization-field rejection, callable operation/SQL/AST proof budgets, within-budget AST-depth acceptance, cached recursion failure, one transformed source scan, matcher parity under overlapping prefixes, Python token refusal before AST construction, producer path/source/result budgets, Git-index non-regular rejection, cold import, and bounded finding truncation. Task 2.3 owns future scope/planner/contributor/executor capacity tests."

[[obligations]]
id = "architecture.static-guard"
owner = "trade_py/devtools architecture quality"
paths = [
  "trade_py/devtools/architecture_guard.py",
  "trade_py/devtools/quality/models.py",
  "trade_py/devtools/quality/scope.py",
  "trade_py/devtools/quality/planner.py",
  "trade_py/devtools/quality/contributors/architecture.py",
  "trade_py/devtools/quality/providers/registry.py",
  "tests/test_architecture_guard.py",
  "tests/test_architecture_contributor.py",
  "tests/test_quality_scope.py",
  "tests/test_quality_planner.py",
]
contracts = [
  "scoped read-only trade dev check architecture step",
  "canonical unfiltered scope metadata and architecture.partial_scope refusal",
  "target dependency and Context Cell graph",
  "trade.architecture.guard.v1 bounded diagnostic envelope",
]
failure_states = [
  "forbidden context implementation import",
  "contract implementation type leak",
  "direct database, artifact, or SQL escape",
  "direct dynamic execution or process creation",
  "partial architecture scope or scope budget exceeded",
  "producer discovery unresolved, undeclared, unsafe, or over budget",
  "invalid or oversized structured diagnostic envelope",
  "Platform business vocabulary",
  "native import outside adapter boundary",
]
spec_requirements = [
  "architecture-static-guardrails:Future target modules SHALL enforce the approved dependency graph",
  "architecture-static-guardrails:Legacy, dynamic execution, and process-spawn paths SHALL be fail-closed",
  "architecture-static-guardrails:Target Context Cells SHALL not leak implementation boundaries",
  "architecture-static-guardrails:Future target persistence and artifact access SHALL preserve Context ownership",
  "architecture-static-guardrails:Platform and native target boundaries SHALL remain technical",
  "architecture-static-guardrails:Architecture results SHALL be bounded, deterministic, and complete for their declared scope",
]
validation_tasks = ["1.1", "1.2", "1.3", "2.2", "2.3", "3.1", "3.2", "3.3"]

[[obligations]]
id = "architecture.baseline"
owner = "architecture governance baseline"
paths = [
  "architecture-baseline.toml",
  "trade_py/devtools/architecture_guard.py",
  "tests/test_architecture_guard.py",
]
contracts = [
  "source-verified legacy package and table inventory",
  "candidate and deferred table classifications",
  "producer-derived artifact and Capture-risk inventory",
  "native, compatibility-pointer, and CLI/HTTP/OpenAPI/SSE source inventory",
]
failure_states = [
  "malformed or unsafe baseline",
  "missing source evidence",
  "duplicate table declaration",
  "unclassified target ownership",
  "stale projection, pointer, Capture, native, or interface fact",
  "producer discovery path, source, or declaration mismatch",
  "attempted database, artifact, or non-evidence-path read",
]
spec_requirements = [
  "architecture-baseline-inventory:The legacy architecture baseline SHALL be source-verified and non-authoritative",
  "architecture-baseline-inventory:Source-only artifact, pointer, receipt, and Capture-risk facts SHALL be complete enough to govern later children",
  "architecture-baseline-inventory:Compatibility and native baseline facts SHALL remain explicit",
]
validation_tasks = ["1.1", "1.2", "1.3", "2.1", "3.1", "3.2", "3.3"]
