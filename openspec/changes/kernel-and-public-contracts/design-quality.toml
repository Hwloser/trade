schema_version = 1
policy_version = "v1"

[[impacts]]
id = "public_contract"
applies = true
reason = "The child introduces installed framework-free Kernel, Platform and Processes contract types, exact v1 wire schemas, status taxonomies and additive one-way legacy mappings while preserving every current CLI, HTTP, SSE, EventBus, job-run, artifact and console contract."

[[impacts]]
id = "persistent_write"
applies = true
reason = "This child implements no durable writer, but its public admission, idempotency fingerprint, operation receipt, fence generation, crash-takeover and terminal-audit contracts normatively govern later persistent writers. Storage evidence therefore applies as a prospective hard prerequisite rather than as authorization to write in this child."

[[impacts]]
id = "schema_migration"
applies = false
reason = "No database table, column, index, migration version, parquet layout, manifest layout or existing payload schema is altered; the new wire DTO schemas are additive public contracts covered by the contract profile."

[[impacts]]
id = "point_in_time"
applies = false
reason = "The child defines only normative owner-reference policy and explicitly defers every reference DTO, DatasetSnapshotRef, clock selection, revision policy, PIT resolution, label, forecast and backtest to its owning prerequisite child; Kernel has no reference module."

[[impacts]]
id = "predictive_model"
applies = false
reason = "No model, feature, recommendation, ranking, calibration, StudyResult or decision-support behavior is created, evaluated, promoted or served."

[[impacts]]
id = "external_event_data"
applies = false
reason = "The child performs no provider interaction, news or event-feed ingestion, capture, import, replay, payload correction, licensing decision or network access. Static owner-codec policy rejects inline external/raw bodies and requires future Capture artifact refs; a legacy EventBus mapper handles metadata only."

[[impacts]]
id = "runtime_concurrency"
applies = true
reason = "The public control contracts define finite observation, cancellation and shutdown deadlines, truthful residual ownership and a prohibition on unbounded tail joins; implementation tests these contracts without rerouting the current runtime."

[evidence.contract]
contract = "The additive public contract is an installed `trade` package containing the parent-approved six Kernel modules, Platform ActorContext/command/query/OperationReceipt/ErrorEnvelope/control DTOs, Processes ProcessView DTOs, owner-local immutable-reference policy, exact bounded v1 canonical JSON, versioned domain-separated fingerprints and pure owner-specific one-way legacy mappers."
consumers = "The immediate consumer is the next platform-persistence-events-and-bootstrap-foundation child. Later Processes, Capture, Datasets, Studies, Decision Support, CLI, HTTP, SDK, notebook, scheduler and event children consume only reviewed target contracts. Existing trade_py/trade_web callers remain on their current paths in this child."
compatibility = "Distribution remains `trade-py`; root `./trade`, `trade-py` console entry, `trade_py` imports, CLI commands/arguments/output/exit codes, HTTP paths/methods/status/headers/payloads, SSE, EventBus topics/admission, job_runs rows, Observatory models/errors, DB schema, artifacts and native ABI remain unchanged. Target packages never import legacy implementation."
migration = "First prove explicit additive source/editable/offline-no-deps wheel package discovery using one wheel; then add unused target contracts and pure owner-specific legacy-to-target mappers. No current caller is rerouted and runtime adoption is blocked on runtime-owner-shutdown-and-recovery-hardening-v1. Each later owner must provide a mutation ledger, old/new snapshots, feature gate, rollback and retirement evidence before adopting a mapper."
rollback = "Stop new child consumers, retain all legacy imports and wire paths, and revert the additive package discovery, target modules, mappers and tests. There is no database, artifact, manifest, pointer or runtime state to restore."

[evidence.storage]
authoritative_writer = "This child has no runtime durable writer and does not authorize one: existing TradeDB/EventBus/Web runtime owners remain unchanged. The later Platform persistence owner must be the sole writer for operation identity, keyed idempotency claim, owner lease/fence generation, terminal audit and outbox facts before any runtime adopts these contracts."
idempotency_key = "This child defines only the contract: FingerprintV1 uses purpose-separated HMAC-SHA-256 with a >=256-bit CSPRNG secret behind a secret-store port. A future owner transaction queries one active and at most three retained key-version candidates: zero matches creates after generation revalidation; one match returns only after command name/kind/fingerprint equivalence; conflict, any multi-match, exhausted key-set contention or refusal-audit failure returns its exact closed ErrorEnvelope with no receipt/operation. No key or claim is persisted by this child."
concurrency_control = "Current runtime concurrency is untouched. The future repository must serialize cross-retained-version lookup plus claim creation and key rotation under one owner CAS/lock with monotonic key_set_generation; one admission uses one monotonic deadline and at most three claim attempts, a changed generation ends that attempt and permits re-derivation only in the next, any multi-match is corruption, owner fence generation rejects every stale writer, and crash takeover requires durable lease expiry or revocation evidence."
staging_validation = "A bounded lexical/structural scanner rejects malformed UTF-8/JSON, depth, string/integer-token, container and aggregate amplification before JSON materialization; bounded parse hooks and iterative post-check then validate exact schema, actor provenance, owner codec, canonical bytes, fingerprint key version, state transition and fence generation. Tests use only in-memory values and temporary roots; no production row, DB or artifact is opened."
atomic_visibility = "This child publishes no runtime state. A future operation admission must make idempotency claim, operation identity, initial receipt and outbox fact visible in one owner-local transaction; a completed shutdown becomes visible only with terminal audit, zero residual owners, released resources and matching-generation fence release."
crash_windows = "A crash in this child leaves no durable state. The future owner must recover pre-claim as absent, post-claim/pre-dispatch as an accepted recoverable operation, post-execution/pre-terminal-audit as unresolved residual ownership, and post-takeover by rejecting the old generation; it must never infer completion from process disappearance."
corrupt_predecessor = "Contract decoders and mappers fail closed on malformed versions, fingerprints, transitions, generations, history windows and legacy paths and perform no repair. A future owner must mark corrupt or unverifiable predecessor state unavailable/failed, preserve safe diagnostic identity and require audited operator or generation recovery."
partial_results = "DTO construction is all-or-nothing. A future writer must not expose a partial admission receipt, partial history window, completed shutdown with residual owners or formal reference with unresolved proof; unavailable, blocked, not_observed and incomplete remain explicit."
reader_consistency = "All current CLI, HTTP, EventBus, job-run and Observatory readers remain unchanged. Future readers consume one owner receipt/view generation and never join private tables across owners; mapper tests are read-only and cannot repair, retry, signal, publish or move pointers."
backup_hash_verification = "This child creates no runtime backup obligation because it writes no state. Before adoption, the runtime hardening/Platform persistence child must rehearse temporary-root backup and restore of operation/idempotency/fence/audit rows, verify row identities and canonical receipt fingerprints, and preserve the prior generation."
small_sample_verification = "Focused temporary fixtures cover one duplicate idempotency claim, one accepted operation, every allowed/forbidden transition, one stale writer, one crash takeover, one terminal-audit failure, exactly 1 and 10 owners in each residual category, and compatibility snapshots. No real data root is used."
rollback = "Before runtime adoption, revert additive package/config/contracts/mappers/tests. After a future owner adopts them, its separate child must first stop new admission, retain old compatible readers and prior fence generation, disable the new adapter and restore the verified prior owner generation without deleting audit facts."
audit_trail = "This OpenSpec, digest-bound review, exact wire goldens, mapper lossiness inventory and git history are this child's audit evidence. Future durable receipts must retain operation/control/correlation/causation identity, trusted initiator, actor provenance, structured fingerprint algorithm/domain/key version, state/reason, owner instance/fence generation, stage, residual ownership and safe errors without raw secrets. Every terminal idempotency conflict/corruption/contention records one immutable refusal fact with a closed 2,048-byte allowlist; corruption also makes one bounded integrity-alert attempt."

[evidence.concurrency]
ownership = "This child owns immutable control DTO semantics and bounded test doubles only; it starts no production worker. Future Platform Execution owns operation/control/shutdown receipts, Processes owns ProcessView, and an owning adapter retains its process/thread/audit/lease/fence generation until structured terminal evidence exists. Current runtime adoption is a hard-gated separate child."
bound = "V1 checks raw input and canonical output at 65,536 bytes, nested containers at depth 8, strings/keys at 2,048 UTF-8 bytes, canonical integer tokens at 19 digits, each container at 100 members, aggregate members at 1,024, value nodes at 2,048, actor scopes at 32, delegation hops at 8, process history at 50, recovery descriptors at 16, safe error text at 1,024 bytes, and all fields at their exact domains. The lexical/structural limits are enforced before JSON materialization. Each command admission has at most 3 claim attempts/12 HMAC derivations/3 candidate queries/3 claim transaction-CAS acquisitions plus 1 refusal-audit transaction, 1 counter, 1 event and at most 1 alert attempt under one monotonic remaining deadline, with no retry/background continuation. Every public observation, cancellation and shutdown API also requires a finite deadline and one remaining-time budget."
ordering = "Trusted actor establishment, static owner-codec admission and typed canonical validation precede domain-separated fingerprinting and durable ingress; durable operation identity precedes OperationReceipt; cancellation intent precedes any terminal cancelled state; shutdown closes admission before graceful/forced cleanup, terminal audit, resource release and matching-generation fence release."
atomicity = "DTO construction is all-or-nothing and returns no partial object. A command-equivalent duplicate across active/retained HMAC versions resolves one identity; a command conflict or any multi-match returns no old receipt/new operation. Rotation and zero-match creation share key_set_generation CAS. Observation timeout mutates no owner state. Completed shutdown is visible only with trusted initiator/control linkage, zero residual owners, durable audit, released non-reentrant resources and release of its own fence generation; stale generations cannot write."
timeout_cancellation = "Owner, control and observation deadlines are distinct. Cancellation acceptance is not cancellation completion. Signal delivery is not terminal evidence. Owner deadline_exceeded requires worker exit or a durable write fence plus recorded residual ownership; caller observation timeout never terminalizes the owner. Every lock, persistence retry, queue drain, thread/future/executor/subprocess wait and process-tree action consumes the shared remaining deadline; no bounded method may call an unbounded tail join."
backpressure = "This child has no production queue. Oversized contract input is rejected before object construction or digesting. Future interfaces return receipts and finite ProcessView observations rather than retaining one synchronous request for an entire workflow."
partial_failure = "Unknown schema/status, unavailable owner, caller timeout, denied control, idempotency command conflict, claim corruption, key-set contention, refusal-audit unavailable, stale writer, incomplete process-tree termination and closed-category residual owners remain exact safe errors or not_observed/unavailable/incomplete states; none is counted as completed, cancelled, empty or healthy."
capacity_validation = "Deterministic tests exercise zero/one/multi-match idempotency, same-key command conflict, duplicate claims for one operation, both paused-admission/key-rotation interleavings and a fake-clock rotation storm that proves changed generation ends its attempt, the 3-claim-attempt/12-HMAC/3-query/3-claim-transaction/1-audit-transaction maxima, the 2,048-byte audit allowlist, all four exact error products, closed metric labels, one-shot redaction/alert behavior and no background continuation; no-sleep fake-clock tests cover exactly 1 and 10 owners in every residual category, exact pre-materialization wire/depth/string/integer/aggregate limits on Python 3.10 and highest supported version, full QueryStatus/shutdown products, non-returning observation, cancellation, takeover/stale writer, concurrent callers and blocking executor tail. One child-process fixture has a 2-second shared deadline, 250-ms tolerance and 5-second whole-fixture ceiling."

