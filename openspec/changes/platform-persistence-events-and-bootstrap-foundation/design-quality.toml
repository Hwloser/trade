schema_version = 1
policy_version = "v1"

[[impacts]]
id = "public_contract"
applies = true
reason = "The child introduces framework-free Platform and Bootstrap contracts for database capabilities, transactions, command admission, message delivery, backup/restore, lifecycle, status and capacity while preserving existing CLI, HTTP, SSE, EventBus, backup, SDK, notebook and scheduler surfaces through explicit compatibility selection."

[[impacts]]
id = "persistent_write"
applies = true
reason = "The design assigns authoritative writers and crash-safe state machines for schema capabilities, writer leases, operation claims/receipts, outbox/inbox/ordering/DLQ records, backup certification, restore transitions, activation journals and capacity evidence."

[[impacts]]
id = "schema_migration"
applies = true
reason = "The design adds a MigrationCoordinator, additive schema capability generations, a single legacy v2-v22 bootstrap bridge, checkpointed owner registrations, mixed-version fencing, dual-read readiness gates and previous-generation rollback."

[[impacts]]
id = "point_in_time"
applies = false
reason = "This technical foundation does not resolve Dataset event/available/revision clocks, snapshots, labels, forecasts or as-known knowledge; formal PIT and revision semantics remain in the next dedicated architecture child."

[[impacts]]
id = "predictive_model"
applies = false
reason = "No model, feature, label, hypothesis, study, recommendation, ranking, calibration or portfolio behavior is introduced or changed; business payloads remain opaque to Platform."

[[impacts]]
id = "external_event_data"
applies = false
reason = "Platform transports already admitted immutable envelopes but performs no provider interaction, news/on-chain ingestion, source licensing decision, capture, replay of provider bytes or external-data correction; those semantics remain owned by Capture."

[[impacts]]
id = "runtime_concurrency"
applies = true
reason = "Database writer/migration leases, owner transactions, command admission, bounded dispatcher workers, inbox/outbox recovery, ordered streams, restore fencing and Bootstrap lifecycle introduce shared runtime ownership, deadlines, cancellation, backpressure and crash recovery."

[evidence.contract]
contract = "New contracts are DatabaseRuntimeRequest/Handle, LocalTransactionContext/Result, MigrationRegistration/Plan/View, GenerationActivationCapability, OutboxEnvelopeRecord, DeliveryLease/Receipt, InboxReceipt, OrderingContract/Ref, DeadLetterView/RedeliverMessage/ResolveOrderingGap, BackupManifest/Certification/TrustPolicyRef, RestoreOperation/View, CapacityEnvelope and BootstrapProfile/Capabilities. They use the exact approved Kernel IDs, envelopes, actors, receipts, errors and bounded codec rather than redefining them."
consumers = "Owning Context repositories and use cases consume the local transaction and delivery protocols; Processes consume command/event and operation handles; CLI, HTTP, SDK, scheduler and operator BFF adapters consume bounded status/query and admission handles; only Bootstrap consumes concrete Platform adapters and the temporary legacy schema bridge."
compatibility = "Current root trade commands, Python entrypoints, FastAPI routes/status/error/SSE payloads, React consumers, EventBus publish/replay behavior, backup functions/CLI, SQLite files/tables, Parquet artifacts, SDK/notebook imports, scheduler topics and C++ boundary remain unchanged until an individually approved shim passes snapshots. Missing legacy actor, payload-proof, ordering or certification facts remain legacy/unknown and are never fabricated."
migration = "Implementation is additive and split into persistence-runtime, command-and-delivery, backup/restore, Bootstrap and interface-compatibility children. Each entrypoint or message family delegates to one selected profile only after contract snapshots, dual observation, owner fencing, capacity evidence and the shutdown-hardening prerequisite; old readers and routes remain selectable for at least 30 days."
rollback = "Disable the named target capability/profile or message route, stop new admissions, select the preserved legacy constructor/EventBus/backup/interface path, reconcile immutable target receipts and outbox/DLQ, and CAS an active restore back to the verified prior generation. Rollback does not delete durable evidence or alter unrelated entrypoints."

[evidence.storage]
authoritative_writer = "Platform Persistence alone writes schema capability, migration checkpoint, writer-lease, global activation-lease and activation-journal metadata; Platform Execution Operation Control alone writes operation claim, receipt and refusal-audit metadata; Platform Events alone writes outbox, delivery, inbox protocol, ordering, gap-resolution, dead-letter and redelivery metadata; Platform Backup alone writes certification and restore-operation metadata and requests activation through Persistence. Every business table, SQL repository, invariant and migration remains with its owning Context."
idempotency_key = "Command admission uses the exact approved scoped idempotency fingerprint, canonical command fingerprint and at most three claim transactions plus one optional refusal-audit transaction under one deadline; inbox uses stable owner-qualified consumer effect namespace plus message ID while contract version and compatibility-policy digest are stored facts but not uniqueness; migrations use owner, migration ID and registration digest; backups use backup ID and trust-policy-certified manifest/archive digest; restore activation uses restore identity plus expected prior/target generation CAS."
concurrency_control = "Every compatible writer carries an owner instance, positive fence generation and finite lease; repository mutations compare the current fence in their transaction. Dispatcher claims use bounded batches, lease tokens and expiry; ordered producer/consumer heads, explicit gap resolution and redelivery use CAS. The sole Persistence activation capability acquires one database activation lease, closes admission, acquires owner fences in ascending canonical owner-namespace order, activates by journal CAS and releases in reverse order only after target or prior readiness. A legacy-unaware writer blocks incompatible cutover unless an independently proven exclusive maintenance window exists."
staging_validation = "Migrations use additive generations or checkpointed shadow-copy/replay and validate registration digest, dependencies, reader parity and capability ranges before activation. Backup uses a consistent SQLite snapshot plus immutable artifact refs and detached trust-policy/key certification. Restore verifies certification before a streaming parse, bounds encoded/declared/actual bytes and expansion ratio, reserves staging/verification/WAL/rollback/safety disk, extracts only declared regular members into a no-follow temporary root, re-hashes all required bytes and validates schema/repository/artifact probes before writer fencing or activation."
atomic_visibility = "One owner-local physical transaction may commit only one owner's state/audit plus Platform inbox/ordered-consumer receipt and outbox records; all participants become visible together or remain absent. Backup is restorable only after manifest/archive certification commits. Restore visibility changes only through one activation-journal compare-and-swap; directory presence and legacy restored status are non-authoritative."
crash_windows = "Owner commit before dispatch leaves a recoverable outbox; dispatcher crash leaves an expiring lease and inbox prevents duplicate effective work; migration resumes only from a matching registration digest/checkpoint; backup partials remain uncertified; restore restart reconciles prepared/staged/fenced/activated/rollback states from the durable journal. Terminal persistence retry stops at the shared deadline and retains residual ownership rather than looping during shutdown."
corrupt_predecessor = "A claim fingerprint mismatch, inbox effect/version/digest/target/schema mismatch, stale fence, changed migration registration, untrusted/revoked certification, unsafe/corrupt/archive-bomb input, incompatible schema capability or activation-journal inconsistency fails closed to conflict, quarantine, verification failure, unavailable or rollback. No moving latest alias, legacy row or directory scan substitutes for missing immutable proof."
partial_results = "Admission without required refusal audit creates no operation; failed owner transactions expose no inbox/outbox; delivery retry/gap/dead-letter and terminal-persistence-unavailable remain explicit; partial migration/backup/remote publication/restore and degraded optional Bootstrap capabilities never become completed, delivered, certified, active or ready."
reader_consistency = "Read-only DatabaseRuntime opens only an existing supported generation and mutates nothing. Target readers bind one schema and activation generation through typed query handles; old readers remain selected through compatibility adapters until dual-read comparison and readiness pass. Interfaces and Contexts cannot query Platform tables or private connections directly."
backup_hash_verification = "Every certified backup records deterministic member paths, kinds, owners, sizes and SHA-256 plus archive digest/size and schema capability, then binds the canonical manifest/archive/generation to an independently configured trust-policy ref, signing key version, validity/revocation decision and detached signature. Restore verifies trust before extraction, enforces streaming encoded/actual/ratio/disk bounds, verifies staged member/archive identities afterward and retains a verified prior generation for activation rollback."
small_sample_verification = "Temporary-root fixtures cover legacy v2-v22 initialization, read-only absent/existing databases, atomic state/inbox/outbox rollback, two-connection duplicate admission, lease crashes, ordered gaps, migration interruption, malicious/corrupt archives and crash at every restore state. A one-generation pilot and 1x/10x fixtures precede any selected entrypoint; no real data probe is required."
rollback = "Capability/profile kill switches preserve legacy readers and the previous active generation. Delivery may be stopped and reconciled without deleting immutable records; additive tables remain inert. Restore rollback compare-and-swaps to the verified prior generation, rebinds and verifies it before reopening writer admission."
audit_trail = "Durable bounded receipts retain operation/message/migration/backup/restore identity, owner, actor where authorized, correlation/causation, policy and digest references, state transition, attempt, fence, timestamps and safe reason. Public/operator views exclude payloads, raw idempotency keys, credentials, archive bytes, SQL, service-account paths and raw tracebacks."

[evidence.migration]
compatibility_modes = ["backward", "forward"]
dual_read_write = true

[evidence.migration.versioning]
strategy = "additive_version"
old_version_preserved = true

[evidence.migration.backfill]
mode = "idempotent_replay"
destructive = false
checkpointed = true

[evidence.migration.cutover]
strategy = "dual_read_compare"
readiness_gate = true

[evidence.migration.rollback]
supported = true
restore_source = "previous_generation"

[evidence.migration.legacy_retirement]
after_compatibility_window = true
minimum_window_days = 30

[evidence.concurrency]
ownership = "A DatabaseRuntime handle owns one database/owner/fence generation; one owner repository owns each business transition; Platform Execution Operation Control owns admission; Platform Events dispatchers own finite leased batches while owner adapters own effective consumption; Platform Backup owns restore coordination, while the sole Platform Persistence activation capability owns global writer fencing and journal CAS for restore and migration; Bootstrap owns concrete construction/lifecycle. Processes, Interfaces and business Contexts never own dispatcher or migration loops."
bound = "V1 rejects envelopes above 65,536 encoded bytes, dispatch/replay claims above 1,000, status histories above 50, DLQ pages above 100, per-key gap buffers above 1,000 messages or 64 MiB, policies above 100 attempts, leases outside 1 second to 15 minutes, restore manifests above 64 MiB encoded/100,000 members/2 TiB declared or actual bytes, archives above 2 TiB encoded or 100:1 expansion, paths above 4,096 UTF-8 bytes/128 segments and CapacityEnvelopes above 256 KiB. These are safety ceilings; measured deployment profiles set lower finite worker, queue, batch, retry, deadline and storage limits."
ordering = "Owner state and outbox commit precede delivery; command admission receipt precedes asynchronous execution; a dispatcher lease precedes invocation and an inbox/owner transaction precedes ack. Ordered producers assign positive sequence with outbox append; consumers compare and advance expected sequence with inbox and owner state. N+1 cannot apply before required N; dead-lettering N retains the head, redelivery preserves its epoch/sequence, and only effective N or an owner-authorized policy-permitted CAS tombstone can advance it."
atomicity = "One local transaction covers only one business owner plus its technical inbox/outbox/receipt participants and cannot span databases, providers, delivery waits or a second business Context. Each of at most three command claim attempts owns at most one transaction; one optional refusal-audit transaction starts only after a claim attempt ends. Inbox receipt, ordered head, owner transition and child outbox are atomic. Migration capability and restore activation advance through the sole Persistence fenced CAS authority, not a cross-Context shared transaction."
timeout_cancellation = "Every admission, lease, retry, gap, migration, restore, remote call and Bootstrap lifecycle carries a finite policy/deadline. Synchronous terminal-state persistence stops when remaining monotonic time expires and returns incomplete/unavailable with retained residual owner. Formal current-runtime shutdown adoption is blocked until the separate hardening child proves concurrent stop, executor tail, process-tree termination and signal-to-reap behavior."
backpressure = "Ingress returns explicit contention/overload rather than attaching callers to long work. Dispatch claims finite batches under fixed worker/queue limits, uses per-key fairness and bounded gap storage, and dead-letters exhausted work without implicitly advancing ordered heads. Restore preflights and continuously enforces member/encoded/declared/actual/ratio bounds plus staging/verification/WAL/prior-rollback/safety disk reserve. Bounded status queries perform no replay/repair. Capacity profiles can defer or reject load and cannot silently derive limits from host CPU count."
partial_failure = "Duplicate admission returns the first receipt, provisional refusal without a committed audit becomes audit-unavailable and creates no operation, owner rollback creates no inbox/outbox, dispatcher crash is lease-reclaimable, ack outage leaves explicit residual state, ordered DLQ retains its head until redelivery/effect or authorized tombstone, migration remains paused/failed/checkpointed, backup remains uncertified, restore rolls back or remains operator-visible, and partial Bootstrap startup reverse-unwinds only acquired resources."
capacity_validation = "Deterministic temporary-root 1x/10x fixtures measure three-attempt admission races, consumer-version duplicate effects, owner/outbox latency, SQLite lock/write time, ordered hot-key/DLQ/head resolution and unordered backlog, lease crash recovery, retry/fairness, migration/restore activation lock order, backup certification and streaming parse/extract ratio/disk reserve, hash/fence/rebind/rollback, CPU/RSS/disk/WAL peaks and recovery. CapacityEnvelope records exact fixture/config/resource generations and returns pass, defer or overload; unavailable telemetry cannot be replaced by zero."

[[obligations]]
id = "platform.persistence-runtime"
owner = "Platform Persistence and target Bootstrap migration profile"
paths = [
  "src/trade/platform/contracts/",
  "src/trade/platform/api/",
  "src/trade/platform/persistence/",
  "src/trade/bootstrap/",
  "tests/unit/platform/persistence/",
  "tests/integration/platform/persistence/",
  "tests/contract/platform/persistence/",
  "tests/architecture/",
]
contracts = [
  "DatabaseRuntimeRequest and DatabaseRuntimeHandle",
  "LocalTransactionContext and LocalTransactionResult",
  "MigrationRegistration Plan and View",
  "LegacySchemaBootstrapAdapter compatibility receipt",
  "GenerationActivationCapability and activation journal",
]
failure_states = [
  "read-only path creates or mutates state",
  "stale expired or mismatched writer fence",
  "cross-Context or cross-database transaction",
  "migration leader race or changed registration digest",
  "legacy unfenced writer during incompatible cutover",
  "restore or migration activation race and lock-order violation",
  "query or Context imports legacy schema bridge",
]
spec_requirements = [
  "platform-persistence-runtime:DatabaseRuntime SHALL separate observation, writing and migration authority",
  "platform-persistence-runtime:Owner transactions SHALL be local and atomically durable",
  "platform-persistence-runtime:MigrationCoordinator SHALL run owner registrations under durable capability fencing",
  "platform-persistence-runtime:Legacy schema bootstrap SHALL be isolated and temporary",
  "platform-persistence-runtime:Platform persistence metadata SHALL have one logical owner",
  "platform-persistence-runtime:Generation activation SHALL use one global fenced authority",
]
validation_tasks = ["1.1", "1.2", "1.3", "2.1", "3.2", "4.1", "4.2", "4.3"]

