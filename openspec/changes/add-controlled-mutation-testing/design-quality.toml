schema_version = 1
policy_version = "v1"

[[impacts]]
id = "public_contract"
applies = true
reason = "Adds canonical trade dev mutation changed|core|full plus qualify/inspect/repair/reconcile, an argv-compatible scripts/mutation-test facade, trade.mutation report/receipt/fallback/bundle/baseline/capacity contracts, exit codes, and GitHub Actions routing without changing runtime product interfaces."

[[impacts]]
id = "persistent_write"
applies = true
reason = "The controller persistently publishes ignored developer report generations, content-addressed result caches, and bounded core/full trend records. These are not runtime business state, but they require explicit single-writer, validation, atomic visibility, corruption, recovery, and rollback semantics."

[[impacts]]
id = "schema_migration"
applies = false
reason = "No business database, payload, parquet, API, or runtime schema changes; versioned mutation report/config formats are additive developer contracts rather than migrated production state."

[[impacts]]
id = "point_in_time"
applies = false
reason = "The change does not compute forecasts, labels, rankings, backtests, snapshots, or point-in-time data and excludes model/research execution from mutation tests."

[[impacts]]
id = "predictive_model"
applies = false
reason = "No model, recommendation, score, calibration, promotion, or trading decision behavior changes; mutation only challenges existing unit tests in temporary source copies."

[[impacts]]
id = "external_event_data"
applies = false
reason = "Mutation workers use synthetic/local unit tests only and do not fetch, ingest, replay, or process news, social, macro, on-chain, provider, or other external event data."

[[impacts]]
id = "runtime_concurrency"
applies = true
reason = "The developer controller owns a bounded worker pool plus independently terminable pytest process groups, global/per-mutant deadlines, cancellation, backpressure, and partial result aggregation."

[evidence.contract]
contract = "Canonical trade dev mutation changed|core|full plus qualify, bundle-or-run inspect, repair, and carrier-aware reconcile, with scripts/mutation-test argv/exit compatibility, safe-root output, lowering-only budget/worker, plan-only, and cache options; parser-only cli.py delegates to application.py over a complete acyclic module graph; a Python 3.7 stdlib sole-spawner supervisor creates trade.mutation.invocation.v1 and its supervisor-only attestation journal before uv; exit 0 complete/zero-work/deferred-only/plan-only/budget-partial, exit 1 future established comparable regression only, exit 2 preflight/degraded/cancelled/report failure; one root-hash-bound trade.mutation.report.v1 generation or supervisor-owned trade.mutation.fallback.v1 diagnostic and one cross-job validated trade.mutation.bundle.v1 in CI."
consumers = "Repository developers, pull-request GitHub Actions, nightly/manual operators, and future baseline reviewers. Existing runtime CLI, HTTP, Web, SDK, scheduler, event, database, artifact, model, C++ and frontend consumers are unchanged."
compatibility = "The surface is additive and initially non-blocking. Existing pytest remains the test framework. Optional mutation dependencies are not runtime dependencies. Missing or invalid explicit changed base fails closed and never broadens to core/full."
migration = "No migration is required. Reports and caches use versioned schemas/keys and are generated only after explicit invocation. The baseline starts unestablished rather than treating the first run as historical truth."
rollback = "Remove the workflow, wrapper, controller, optional dependency group, configuration, tests and documentation. Ignored reports/caches are disposable; no runtime state or data restoration is needed."

[evidence.storage]
authoritative_writer = "The Python 3.7 stdlib supervisor is the sole OS child spawner, invocation-receipt writer, supervisor-attestation-journal writer, and writer of every fallback; controller Landlock policy denies create/write/rename/link/remove access to those roots even though the controller shares the control-channel MAC key. One receipt-bound controller is the sole writer for its UUID report staging/final generation below owned repository .mutation-testing and can only request fallback. An output-root lock serializes report publication and projections. Only scheduled core/full own shared trend/cache/aggregate writes; manual and changed runs write factual bundles only, while an environment-approved reconcile route may publish one validated repaired carrier."
idempotency_key = "A report generation is identified by run_id plus sealed GitScopeSnapshot, config, import-closure, mapped-definition/test, dependency-environment, platform, command, cohort, and tool digests. Supervisor attestation entries form a run-bound hash chain. Cache entries require closure identity plus source-exact execution_id and a post-publication score-eligible commit marker. Report and trend have independent monotonic sequences; scheduled trend uses one reviewed genesis marker, high-water/checkpoint and content-addressed source/tombstone hash chain. CI bundles bind exact receipt, complete attestation journal and evidence roots."
concurrency_control = "The supervisor creates receipt/CLOCK_BOOTTIME deadlines before uv, becomes subreaper, owns bounded channel-authenticated spawn/signal/wait/fallback requests, source-exclusive attestation, opaque handles, fork-stop delegated-cgroup/session admission, pidfds, signal forwarding, continued cleanup and fallback. Successful OS child creation is journaled before registration. The controller stages under run_id and holds a boot-bound lease but cannot spawn or write supervisor roots. One output lock covers quarantine, separate report/trend sequence reservation, manifest-root publication, retention, cache commit, trend source/tombstone/high-water and reconciliation. Repair/reconcile take the same lock and default dry-run."
staging_validation = "The controller validates safe output ownership, sealed Git scope, redaction, receipt transitions, exact pass-FD closure and SCM_RIGHTS handoff, supervisor-attestation references, controller-private syscall-audit lifecycle, normal or constrained forced-close listener-drain handoff, sticky integrity plus cleanup override, the closed fifteen-status mutation/worker-spawned/worker-registered/test/cleanup matrix, phase algebra, run-score eligibility, CoverageTupleEvidenceV1, per-file/generation/receipt/journal/aggregate/renderer bounds, source/comparison/cache identities, member hashes, and non-self manifest root. Cache reads require score-eligible markers; scheduled trend validates genesis/chain; CI independently revalidates downloaded trade.mutation.bundle.v1 bytes."
atomic_visibility = "Supervisor receipt and attestation entries are append/fsync/hash-chain bound. JSON, Markdown and HTML are flushed/fsynced; manifest hashes every other member; report sequence is reserved/fsynced before current.json and the supervisor receipt anchor manifest hash, byte size and sequence. Scheduled-only cache markers and independent core/full trend source/tombstone/high-water records are idempotent post-publication projections; trend.jsonl is atomically rebuilt. CI bundles have a read-back-verified manifest and cross-job artifact digest."
crash_windows = "A crash before current-pointer replacement leaves the prior generation current and leased staging unreferenced; after replacement it exposes one root-verified generation. An unresolved report reservation commits only when current.json exactly matches run/sequence/root/size, otherwise tombstones. Controller loss leaves supervisor-owned cleanup plus root or fallback evidence. Cache/trend projection failure leaves report truth and a receipt gap; active leases prevent cleanup."
corrupt_predecessor = "Corrupt predecessor state fails closed under the publication lock: malformed, oversized, symlinked, path-escaping, missing-generation, identity, root, member, sequence high-water, checkpoint or hash-chain mismatch is quarantined or yields exact run/bundle inspect and explicit-carrier dry-run/apply repair/reconcile commands. One unused matching reviewed genesis marker alone permits first pointer absence; later missing aggregate starts predecessor_unavailable, while corrupt highest starts predecessor_invalid and cannot silently fall back."
partial_results = "Every selected mutant receives exactly one closed terminal plus mutation-applied/worker-spawned/worker-registered/test-started facts and orthogonal cleanup. Sticky integrity or unconfirmed cleanup replaces provisional natural/timeout/cancel outcomes with phase-appropriate infrastructure and forces score ineligibility/degraded-infrastructure run precedence. Factual numerator/denominator remain auditable while displayed score is null. Deadline, signal, baseline and worker degradation publish a marked partial generation when possible. Projection degradation remains visible in the receipt without rewriting report truth; publication failure preserves staging and asks the supervisor for a typed bounded fallback."
reader_consistency = "Readers resolve one receipt/current pointer, verify supervisor attestation references, manifest root and member hashes, and read one immutable generation. Raw receipt+attestation+report-or-fallback+expected-bundle evidence expires as one invocation-kind-aware unit; local bundle expectation is explicitly not_applicable while CI is required. Separately retained compact trend anchors expose detail_evidence=expired and cannot establish baseline or detailed comparability. Cache readers require closure identity and score-eligible commit marker; trend readers validate reviewed genesis plus compact source records and expose gaps until explicit carrier-aware reconcile."
backup_hash_verification = "Report recovery verifies supervisor attestation chain, manifest SHA-256/size/report-sequence from receipt/current and every member hash. CI execution constructs/read-back verifies an immutable receipt/attestation/evidence/validation bundle, uploads exact bytes, and the next job independently downloads/recomputes it. Baselines reopen a verified score-eligible bundle and recompute key sets/counts/score. Cache markers, trend genesis/source/tombstone/high-water/checkpoint and rolling aggregates are hashed; disposable ignored developer state requires no business-data backup."
small_sample_verification = "Temporary-root tests interrupt receipt/attestation/report-sequence/pointer/cache/trend-sequence/bundle phases, fail child registration, kill the controller, race leases/same-key writers, saturate the bounded protocol/journal, corrupt every pointer/root/chain/highest aggregate state, rerun an old workflow tuple, and verify genesis/predecessor-invalid/unavailable/non-monotonic or explicit-carrier reconcile. They exercise all CLI schemas/exits, custom output roots, bundle inspection, local-versus-CI retention, closed phase/score algebra, finite bootstrap memory, changed no-restore 15-minute equation, representative core/full 45/110 qualification, and valid/invalid/missing/hard-loss summary binding."
rollback = "Rollback removes tracked workflow, controller, configuration and documentation without mutating runtime data. Ignored report generations, caches and trend records remain available for manual audit and can be deleted separately; no rollback rewrites current.json to fabricate an older result or imports developer state into production."
audit_trail = "The phase-journal receipt, source-exclusive supervisor attestation journal, immutable manifest, trend genesis/chain, capacity record and CI bundle record run_id, CLOCK_BOOTTIME/boot ID deadlines, mode, sealed Git scope, config/tool/environment/execution/comparison/cohort/runner digests, budgets, spawned/registered/test phase facts, score eligibility, stop/status/cleanup, spawn-handle/FD/broker/drain policy, independent guard/audit lifecycles, cancellation, invocation-kind retention, report/trend/aggregate decisions without credentials or production data."

[evidence.concurrency]
ownership = "One Python 3.7 stdlib supervisor creates receipt/deadline before uv and alone owns OS spawn, source-exclusive hash-chained attestation, bounded channel-authenticated protocol, opaque handles, fork-stop delegated-cgroup/session admission, pidfds, subreaping, signal/wait/reap, child guard read end/verification/forced-close, continued cleanup and every fallback. One non-spawning controller owns planning, bounded logical threads, seccomp listener, brokered-open decisions, private syscall audit, and typed outcomes but cannot write supervisor roots. application.py alone coordinates use cases; cli.py only parses/renders. Each thread owns one bytecode-clean closure tree; child owns only its guard writer."
bound = "Mode limits are 150/1000/5000 generated/selected mutants and 600/1800/5400 controller seconds with 30/60/120 in-budget reserves; scans are separately 3000/20000/100000 positions and 3/20/100 million visits; source/dependency/tree/output/remote-restore bounds are finite. Changed remote restore is zero. First measurements use finite identity-bound 512-MiB controller and 1024-MiB baseline caps; later workers use min(4, floor(effective CPU/2)) plus measured, enforced cgroup v2 memory.max/high/swap/pids and fixed reserves. Absent delegated finite cgroup is plan-only. Native threads are one."
ordering = "Changed admits only CanonicalMutationPositionV1 on exact changed lines under a sealed GitScopeSnapshot; core/full use configured definition priority, then repository-relative path, byte position, operator priority/name and execution occurrence. Completion order never changes serialization. Report and trend use separate sequences; only scheduled core/full consume reviewed genesis/restore and reserve shared trend. Manual/changed cannot advance high-water. CI aggregate and approved reconcile publication use numeric workflow-run-ID/run-attempt and refuse a tuple not strictly newer than its validated predecessor."
atomicity = "Threads share no mutable tree. One operator-local position-verified mutation is applied to one closure tree. Successful OS spawn is attested before registration; every spawned child has confirmed or unconfirmed cleanup. Sticky integrity and final cleanup override provisional control events in the closed phase matrix, while factual score counts remain and score eligibility controls projections. JSON/Markdown/HTML plus non-self manifest publish under one leased run ID and report sequence; scheduled-only cache/trend projections follow; supervisor fallback and cross-job CI bundle never change current."
timeout_cancellation = "Baseline/mutant pytest run in supervisor-owned cgroups/groups; events use CLOCK_BOOTTIME, control events are provisional, integrity is sticky dominant after normal listener drain or timeout/cancel drain-ownership handoff plus supervisor forced-close attestation, and cleanup unconfirmed forces infrastructure. Admission requires ordinary timeout plus cleanup before execution deadline. Controller requests by opaque handle; supervisor uses pidfd/cgroup/TERM/KILL/observable reap; changed 2+10+2+1, core 4+3+30+5+3, and full 4+3+90+10+3 outer equations are final containment."
backpressure = "Admission uses CPU plus finite bootstrap and enforced measured per-worker memory reserves, native threads one, protocol frames 64 KiB/JSON 48 KiB/eight FDs, at most workers in-flight and active handles plus 2*workers+4 queued requests, bounded attestation entries, deadline checks during Git/source/AST/dependency/copy/coverage, cleanup/report/bundle/upload reserves and worst-case report capacity. Changed requires readiness plus one exact cold-cache smoke; scheduled core/full require representative tuple-stratified qualification. Bounded restore diagnostics, producer quotas, and an externally provisioned disposable runner are required before their respective execution routes."
partial_failure = "Baseline failure marks only its tuple unavailable with a closed reason and never increments mutant timeout. Closed terminal/phase/cleanup facts keep kills/survivors, no-coverage, invalid, timeout, infrastructure, cancellation and not-run distinct; cleanup unconfirmed is orthogonal but forces infrastructure. Supervisor loss fallback, projection gaps and predecessor-invalid/unavailable epochs remain explicit and never rewrite report truth."
capacity_validation = "Tests force source/AST/closure/visit/scanned/generated/tree/temp/native-thread/bootstrap/per-worker-memory/time/detail/generation/receipt/attestation/cache/bundle/restore/upload-quota ceilings, pre-uv Python/CLOCK_BOOTTIME, sole-spawner bounded protocol saturation, controller-write denial, spawn-before-registration cleanup, fork-stop delegated cgroup admission, unique-cgroup OOM, sticky integrity/score/cleanup precedence, listener-drain forced-close restrictions, SCM_RIGHTS and brokered open, supervisor guard/controller audit streams, changed smoke plus tuple-stratified scheduled capacity equations, reviewed genesis and aggregate invalid/unavailable/non-monotonic predecessor, cross-job bundle inspection and valid/invalid/missing/hard-loss CI-summary validation, redaction and interruption."

