[[obligations]]
id = "mutation.gradual-policy"
owner = "mutation baseline and exception governance"
paths = [
  "config/mutation-baseline.json",
  "config/mutation-exceptions.toml",
  "trade_py/devtools/mutation_testing/baseline.py",
  "trade_py/devtools/mutation_testing/exceptions.py",
  "docs/mutation-testing.md",
  "tests/test_mutation_baseline.py",
  "tests/test_mutation_config.py",
]
contracts = [
  "initial report-only policy",
  "future comparable five-point regression advisory",
  "70 percent changed core target and future 80 percent mature target",
  "exact expiring mutant-ID, CanonicalMutationPositionV1, operator-argument and execution-occurrence exceptions",
  "complete unambiguous comparison cohort with identical score denominator and membership digests",
  "baseline binds immutable bundle and is recomputed from per-mutant key sets",
  "RFC3339 skew, paired realtime/boottime and cross-run trusted-UTC rollback with bounded intervals",
]
failure_states = [
  "fabricated initial baseline",
  "broad wildcard exception",
  "expired or stale exception",
  "score inflation by no-coverage or timeout",
  "different or partial cohorts compared as regression",
  "score denominator drift compared as regression",
  "execution identity weakened for comparison",
  "stored-only aggregate trusted as baseline",
  "clock rollback extends an exception or qualification",
]
spec_requirements = [
  "controlled-mutation-testing:Mutation quality policy SHALL be gradual and auditable",
]
validation_tasks = ["2.1", "2.10", "2.13", "3.2"]

[[obligations]]
id = "mutation.ci-routing"
owner = "GitHub Actions mutation workflow"
paths = [
  ".github/workflows/mutation-testing.yml",
  "trade",
  "scripts/mutation-test",
  "config/mutation-capacity.json",
  "trade_py/devtools/mutation_testing/bundle.py",
  "trade_py/devtools/mutation_testing/capacity.py",
  "trade_py/devtools/mutation_testing/trend.py",
  "tests/test_mutation_workflow.py",
  "docs/mutation-testing.md",
]
contracts = [
  "PR changed only",
  "nightly core and weekly full are the only ordinary shared-trend writers",
  "changed and manual core/full perform no remote carrier list/read/download and publish factual bundles but no shared trend, cache or aggregate carrier",
  "report-only mutation outcomes with original exit preserved",
  "execution job builds and uploads exact mode-bounded immutable terminally sealed attestation-bound trade.mutation.bundle.v1",
  "when scheduled, a separate job downloads bytes and independently validates valid, invalid, missing or hard-loss evidence",
  "validation job publishes sole authoritative trade.mutation.ci-summary.v1 with nullable controller exit derived from trusted receipt, start/finish sentinels, conclusion, cancellation, artifact and validation facts",
  "receipt plus supervisor-attestation plus generation-or-fallback and validation digest",
  "whole-workflow cancellation before validation is explicitly best effort",
  "literal UTC schedules and shared one-running/latest-pending long-run group",
  "hard runner loss documented best effort",
  "disposable bounded result cache separated from trend evidence",
  "bounded numeric workflow-run-ID/run-attempt rolling aggregate restore with invalid/unavailable epoch gaps",
  "one reviewed genesis marker plus protected create-only consumption ref permits only the first no-predecessor trend checkpoint",
  "closed workflow_dispatch operation core|full|reconcile with cross-field validation and explicit-carrier dry-run-first environment-approved reconcile route",
  "ephemeral trade-mutation-v1 runner and identity, finite bootstrap/measured memory, freshness and pass-equation-bound qualification",
  "GitHub repository owner huanwei1208-accountable runner child change, named platform operator, three-run readiness and changed-smoke prerequisites",
  "changed zero-remote 15-minute, core 45-minute and full 110-minute equations plus namespace-aware complete 15-cache/91-aggregate scheduled-only producer quota inventory",
]
