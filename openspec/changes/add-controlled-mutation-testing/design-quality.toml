owner = "trade_py/devtools/mutation_testing supervisor, selection, process supervisor and scheduler"
paths = [
  "trade",
  "scripts/mutation-test",
  "trade_py/devtools/mutation_testing/bootstrap_contract.py",
  "trade_py/devtools/mutation_testing/supervisor.py",
