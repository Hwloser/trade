schema_version = 1
policy_version = "v1"

[[impacts]]
id = "public_contract"
applies = true
reason = "Adds canonical trade dev mutation changed|core|full plus qualify/inspect/repair/reconcile, an argv-compatible scripts/mutation-test facade, trade.mutation report/receipt/fallback/bundle/baseline/capacity contracts, exit codes, and GitHub Actions routing without changing runtime product interfaces."

[[impacts]]
id = "persistent_write"
applies = true
reason = "The controller persistently publishes ignored developer report generations, content-addressed result caches, and bounded core/full trend records. These are not runtime business state, but they require explicit single-writer, validation, atomic visibility, corruption, recovery, and rollback semantics."

[[impacts]]
id = "schema_migration"
applies = false
reason = "No business database, payload, parquet, API, or runtime schema changes; versioned mutation report/config formats are additive developer contracts rather than migrated production state."

[[impacts]]
id = "point_in_time"
applies = false
reason = "The change does not compute forecasts, labels, rankings, backtests, snapshots, or point-in-time data and excludes model/research execution from mutation tests."

[[impacts]]
id = "predictive_model"
applies = false
reason = "No model, recommendation, score, calibration, promotion, or trading decision behavior changes; mutation only challenges existing unit tests in temporary source copies."

[[impacts]]
id = "external_event_data"
applies = false
reason = "Mutation workers use synthetic/local unit tests only and do not fetch, ingest, replay, or process news, social, macro, on-chain, provider, or other external event data."

[[impacts]]
id = "runtime_concurrency"
applies = true
reason = "The developer controller owns a bounded worker pool plus independently terminable pytest process groups, global/per-mutant deadlines, cancellation, backpressure, and partial result aggregation."

[evidence.contract]
contract = "Canonical trade dev mutation changed|core|full plus qualify/inspect/repair/reconcile, with scripts/mutation-test argv/exit compatibility, safe-root output, lowering-only budget/worker, plan-only, and cache options; a Python 3.7 stdlib sole-spawner supervisor creates trade.mutation.invocation.v1 before uv; exit 0 complete/zero-work/deferred-only/plan-only/budget-partial, exit 1 future established comparable regression only, exit 2 preflight/degraded/cancelled/report failure; one root-hash-bound trade.mutation.report.v1 generation or supervisor-owned trade.mutation.fallback.v1 diagnostic and one cross-job validated trade.mutation.bundle.v1 in CI."
consumers = "Repository developers, pull-request GitHub Actions, nightly/manual operators, and future baseline reviewers. Existing runtime CLI, HTTP, Web, SDK, scheduler, event, database, artifact, model, C++ and frontend consumers are unchanged."
compatibility = "The surface is additive and initially non-blocking. Existing pytest remains the test framework. Optional mutation dependencies are not runtime dependencies. Missing or invalid explicit changed base fails closed and never broadens to core/full."
migration = "No migration is required. Reports and caches use versioned schemas/keys and are generated only after explicit invocation. The baseline starts unestablished rather than treating the first run as historical truth."
rollback = "Remove the workflow, wrapper, controller, optional dependency group, configuration, tests and documentation. Ignored reports/caches are disposable; no runtime state or data restoration is needed."

[evidence.storage]
authoritative_writer = "The Python 3.7 stdlib supervisor is the sole OS child spawner, invocation-receipt writer, and writer of every fallback; one receipt-bound controller is the sole writer for its UUID run staging/final generation below owned repository .mutation-testing and can only request fallback. An output-root lock serializes report/trend sequence reservation, pointer recovery, retention, report publication and post-publication cache/trend projections. Landlock rejects runtime databases, parquet, provider data, and production artifacts."
idempotency_key = "A report generation is identified by run_id plus sealed GitScopeSnapshot, config, import-closure, mapped-definition/test, dependency-environment, platform, command, cohort, and tool digests. Cache entries require closure identity plus source-exact execution_id and a post-publication commit marker. Report and trend have independent monotonic sequences; trend uses high-water/checkpoint and content-addressed source/tombstone hash chain. CI bundles bind exact receipt and evidence roots."
concurrency_control = "The supervisor creates receipt/CLOCK_BOOTTIME deadlines before uv, becomes subreaper, owns authenticated bounded spawn/signal/wait/fallback requests, opaque handles, fork-stop delegated-cgroup/session admission, pidfd identities, signal forwarding, continued cleanup and fallback. The controller stages under run_id and holds a boot-bound lease but cannot spawn. One output lock covers quarantine, separate report/trend sequence reservation, manifest-root publication, retention, cache commit, trend source/tombstone/high-water and reconciliation. Repair/reconcile take the same lock and default dry-run."
staging_validation = "The controller validates safe output ownership, sealed Git scope, redaction, receipt transitions, exact pass-FD closure and SCM_RIGHTS handoff, independent child-write/controller-read guard and controller-private syscall-audit lifecycles, sticky integrity plus cleanup override, the closed sixteen-status phase matrix/count algebra, per-file/generation/receipt/ledger/aggregate/renderer bounds, source/comparison/cache identities, member hashes, and non-self manifest root. Cache reads require markers; trend validates chain; CI independently revalidates downloaded trade.mutation.bundle.v1 bytes."
atomic_visibility = "JSON, Markdown and HTML are flushed/fsynced; manifest hashes every other member; report sequence is reserved/fsynced before current.json and the supervisor receipt anchor manifest hash, byte size and sequence. Cache markers and independent core/full trend source/tombstone/high-water records are idempotent post-publication projections; trend.jsonl is atomically rebuilt. CI bundles have a read-back-verified manifest and cross-job artifact digest."
crash_windows = "A crash before current-pointer replacement leaves the prior generation current and leased staging unreferenced; after replacement it exposes one root-verified generation. An unresolved report reservation commits only when current.json exactly matches run/sequence/root/size, otherwise tombstones. Controller loss leaves supervisor-owned cleanup plus root or fallback evidence. Cache/trend projection failure leaves report truth and a receipt gap; active leases prevent cleanup."
corrupt_predecessor = "Corrupt predecessor state fails closed under the publication lock: malformed, oversized, symlinked, path-escaping, missing-generation, identity, root, member, sequence high-water, checkpoint or hash-chain mismatch is quarantined or yields exact inspect and dry-run/apply repair/reconcile commands. First pointer absence is explicit; corrupt cache is a miss; missing aggregate starts predecessor_unavailable while corrupt highest aggregate starts predecessor_invalid and cannot silently fall back."
partial_results = "Every selected mutant receives exactly one closed terminal status plus mutation-applied/test-started facts and orthogonal cleanup status. Sticky integrity or unconfirmed cleanup replaces provisional natural/timeout/cancel outcomes with phase-appropriate infrastructure. Deadline, signal, baseline and worker degradation publish a marked partial generation when possible. Projection degradation remains visible in the receipt without rewriting report truth; publication failure preserves staging and asks the supervisor for a typed bounded fallback."
reader_consistency = "Readers resolve one receipt/current pointer, verify its manifest root then member hashes, and read one immutable generation. Dangling retained receipts become evidence-expired tombstones. Cache readers require closure identity and commit marker; trend readers validate compact source records and expose gaps until explicit reconcile instead of treating a truncated projection as complete."
backup_hash_verification = "Report recovery verifies manifest SHA-256/size/report-sequence from receipt/current and every member hash. CI execution constructs/read-back verifies an immutable receipt/evidence/validation bundle, uploads exact bytes, and the next job independently downloads/recomputes it. Baselines reopen a verified bundle and recompute key sets/counts/score. Cache markers, trend source/tombstone/high-water/checkpoint and rolling aggregates are hashed; disposable ignored developer state requires no business-data backup."
small_sample_verification = "Temporary-root tests interrupt receipt/report-sequence/pointer/cache/trend-sequence/bundle phases, kill the controller, race leases/same-key writers, corrupt every pointer/root/chain/highest aggregate state, and verify predecessor/successor, predecessor-invalid/unavailable epoch, or explicit reconcile. They exercise inspect/repair/reconcile schemas/exits, retention tombstones, closed terminal matrix, capacity equations, cross-directory bundle binding and lowered-budget roots."
rollback = "Rollback removes tracked workflow, controller, configuration and documentation without mutating runtime data. Ignored report generations, caches and trend records remain available for manual audit and can be deleted separately; no rollback rewrites current.json to fabricate an older result or imports developer state into production."
audit_trail = "The phase-journal receipt, immutable manifest, trend chain, capacity record and CI bundle record run_id, CLOCK_BOOTTIME/boot ID deadlines, mode, sealed Git scope, config/tool/environment/execution/comparison/cohort/runner digests, budgets, phase facts, stop/status/cleanup, spawn-handle/FD/broker policy, independent guard/audit lifecycles, cancellation, cache/retention/report-sequence/trend-sequence/aggregate decisions without credentials or production data."

[evidence.concurrency]
ownership = "One Python 3.7 stdlib supervisor creates receipt/deadline before uv and alone owns OS spawn, authenticated control protocol, opaque handles, fork-stop delegated-cgroup/session admission, pidfds, subreaping, signal/wait/reap, continued cleanup and every fallback. One non-spawning controller owns planning, bounded logical threads, seccomp listener, brokered-open decisions, private syscall audit, and typed outcomes. Each thread owns one bytecode-clean closure tree; child only owns guard write end while controller owns read end."
bound = "Mode limits are 150/1000/5000 generated/selected mutants and 600/1800/5400 controller seconds with 30/60/120 in-budget reserves; scans are separately 3000/20000/100000 positions and 3/20/100 million visits; source/dependency/tree/output/remote-restore bounds are finite. Workers use min(4, floor(effective CPU/2)) plus enforced per-worker cgroup v2 memory.max/high/swap/pids and fixed controller/safety/renderer reserves; absent delegated finite cgroup is plan-only. Native threads are one."
ordering = "Changed admits only canonical mutation-token positions on exact changed lines under a sealed GitScopeSnapshot; core/full use configured definition priority, then repository-relative path, line, column, operator priority/name and execution occurrence. Completion order never changes serialization. Report and trend use separate sequences; CI aggregate restore uses numeric workflow-run-ID/run-attempt tuple."
atomicity = "Threads share no mutable tree. One operator-local position-verified mutation is applied to one closure tree. Sticky integrity and final cleanup override provisional control events in the closed phase matrix. JSON/Markdown/HTML plus non-self manifest publish under one leased run ID and report sequence; independent cache/trend projections follow; supervisor fallback and cross-job CI bundle never change current."
timeout_cancellation = "Baseline/mutant pytest run in supervisor-owned cgroups/groups; events use CLOCK_BOOTTIME, control events are provisional, integrity is sticky dominant after drain/stream completion, and cleanup unconfirmed forces infrastructure. Admission requires ordinary timeout plus cleanup before execution deadline. Controller requests by opaque handle; supervisor uses pidfd/cgroup/TERM/KILL/observable reap; outer CI timeout is final containment."
backpressure = "Admission uses CPU plus enforced per-worker and fixed memory reserves, native threads one, finite queue, deadline checks during Git/source/AST/dependency/copy/coverage, cleanup/report reserve and worst-case report capacity. Runner-identity/freshness/pass-equation-bound serial and capacity qualification, bounded bundle/cache/aggregate candidates/bytes/deadlines, and disposable ephemeral CI runners are required before schedules."
partial_failure = "Baseline failure marks only its tuple unavailable with a closed reason and never increments mutant timeout. Closed terminal/phase/cleanup facts keep kills/survivors, no-coverage, invalid, timeout, infrastructure, cancellation and not-run distinct; cleanup unconfirmed is orthogonal but forces infrastructure. Supervisor loss fallback, projection gaps and predecessor-invalid/unavailable epochs remain explicit and never rewrite report truth."
capacity_validation = "Tests force source/AST/closure/visit/scanned/generated/tree/temp/native-thread/per-worker-memory/time/detail/generation/receipt/ledger/cache/bundle/restore ceilings, pre-uv Python/CLOCK_BOOTTIME, sole-spawner protocol, fork-stop delegated cgroup admission, unique-cgroup OOM, sticky integrity/cleanup override, SCM_RIGHTS and brokered open, independent guard/audit streams, runner capacity equations/freshness, rolling aggregate invalid predecessor, cross-job bundle validation, redaction and interruption."

