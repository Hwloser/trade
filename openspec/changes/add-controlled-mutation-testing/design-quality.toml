schema_version = 1
policy_version = "v1"

[[impacts]]
id = "public_contract"
applies = true
reason = "Adds the developer-facing scripts/mutation-test changed|core|full command, trade.mutation.report.v1 JSON/Markdown/HTML contract, configuration schemas, exit codes, and GitHub Actions routing without changing runtime product interfaces."

[[impacts]]
id = "persistent_write"
applies = true
reason = "The controller persistently publishes ignored developer report generations, content-addressed result caches, and bounded core/full trend records. These are not runtime business state, but they require explicit single-writer, validation, atomic visibility, corruption, recovery, and rollback semantics."

[[impacts]]
id = "schema_migration"
applies = false
reason = "No business database, payload, parquet, API, or runtime schema changes; versioned mutation report/config formats are additive developer contracts rather than migrated production state."

[[impacts]]
id = "point_in_time"
applies = false
reason = "The change does not compute forecasts, labels, rankings, backtests, snapshots, or point-in-time data and excludes model/research execution from mutation tests."

[[impacts]]
id = "predictive_model"
applies = false
reason = "No model, recommendation, score, calibration, promotion, or trading decision behavior changes; mutation only challenges existing unit tests in temporary source copies."

[[impacts]]
id = "external_event_data"
applies = false
reason = "Mutation workers use synthetic/local unit tests only and do not fetch, ingest, replay, or process news, social, macro, on-chain, provider, or other external event data."

[[impacts]]
id = "runtime_concurrency"
applies = true
reason = "The developer controller owns a bounded worker pool plus independently terminable pytest process groups, global/per-mutant deadlines, cancellation, backpressure, and partial result aggregation."

[evidence.contract]
contract = "scripts/mutation-test changed|core|full with safe-root output, lowering-only budget/worker, plan-only, and cache options; exit 0 complete/zero-work/deferred-only/plan-only/budget-partial without infrastructure failure, exit 1 future established comparable policy regression only, exit 2 preflight/degraded/cancelled/report infrastructure failure; one trade.mutation.report.v1 JSON/Markdown/HTML/manifest generation or one non-authoritative fallback diagnostic."
consumers = "Repository developers, pull-request GitHub Actions, nightly/manual operators, and future baseline reviewers. Existing runtime CLI, HTTP, Web, SDK, scheduler, event, database, artifact, model, C++ and frontend consumers are unchanged."
compatibility = "The surface is additive and initially non-blocking. Existing pytest remains the test framework. Optional mutation dependencies are not runtime dependencies. Missing or invalid explicit changed base fails closed and never broadens to core/full."
migration = "No migration is required. Reports and caches use versioned schemas/keys and are generated only after explicit invocation. The baseline starts unestablished rather than treating the first run as historical truth."
rollback = "Remove the workflow, wrapper, controller, optional dependency group, configuration, tests and documentation. Ignored reports/caches are disposable; no runtime state or data restoration is needed."

[evidence.storage]
authoritative_writer = "One mutation controller invocation is the sole writer for its UUID run directory below owned repository .mutation-testing. An output-root lock serializes current-pointer, retention, and trend publication; cache entries have one content-addressed execution key and are published by the controller only. Runtime databases, parquet, provider data, and production artifacts are rejected writer targets."
idempotency_key = "A report generation is identified by run_id plus config, source-tree, mapped-definition/test, dependency-environment, platform, command, cohort, and tool digests. A cache entry uses complete cache identity plus source-exact execution_id; a trend comparison uses run_id and exact unambiguous comparison-key cohort and rejects duplicate run IDs."
concurrency_control = "Each invocation stages under a unique run_id and holds a PID/start-token/boot-identity lease. A bounded exclusive output-root publication lock covers manifest verification, retention, current-pointer replacement, and core/full trend update. Same-key cache races use exclusive creation or a per-key lock followed by digest verification; scavenging requires non-blocking lease acquisition and 24-hour stale validation."
staging_validation = "The controller validates safe output ownership, redaction, schema, fresh/cache/plan count equations, selected-mutant terminal coverage, per-file/generation/renderer bounds, source/comparison/cache identities, and SHA-256 for JSON, Markdown, and HTML before a complete manifest. Cache and trend records are size/record/age bounded and schema/identity/digest checked before publication or reuse."
atomic_visibility = "JSON, Markdown, HTML, and manifest are flushed and fsynced in a private run_id staging directory, renamed to the final run directory, and exposed together only by same-directory fsync plus atomic replacement of current.json. Cache records use write/fsync/rename/directory-fsync; trend uses a staged complete bounded file and atomic replacement."
crash_windows = "A crash before current-pointer replacement leaves the prior generation current and the new leased staging directory unreferenced; a crash after replacement exposes only a fully validated generation. Publication failure writes a separate bounded fallback without changing current. Cache/trend crashes leave no reusable successor unless schema and digest pass; active leases prevent cleanup by concurrent invocations."
corrupt_predecessor = "Malformed, oversized, symlinked, path-escaping, identity-mismatched, or hash-mismatched report pointers, manifests, cache entries, and trend files are never treated as successful outcomes. Reports fail closed while preserving evidence; cache entries are ignored and recomputed; a corrupt trend is quarantined and a fresh bounded trend starts with an explicit recovery record."
partial_results = "Every selected mutant receives one terminal status, including not_run_plan, not_run_budget and infrastructure_error, with outcome_origin fresh or cache where applicable. Cancellation, deadline, baseline degradation, and worker failure publish a marked partial generation when storage remains available. Publication failure preserves staged evidence, writes a bounded fallback, and returns exit 2 without presenting partial files as current."
reader_consistency = "Readers resolve current.json once, validate its run_id, schema, manifest and member digests, and then read only that immutable generation. They never combine files from different run IDs. Cache and trend readers validate complete identity and digest before use and otherwise behave as a cache miss or explicit trend recovery."
backup_hash_verification = "Report recovery verification uses the manifest SHA-256 and byte size for every member, read back before pointer publication and again before CI uploads the immutable run generation. Cache and trend atomic-write tests read back and hash every record; disposable ignored developer state requires no business-data backup or restore path."
small_sample_verification = "Temporary-directory tests interrupt each publication phase, race active leases and same-key cache writers, inject redaction sentinels, corrupt pointers/manifests/cache/trend records, exceed every per-file/generation/retention bound, duplicate trend run IDs, and verify readers see either one complete predecessor or one complete successor. A lowered-budget smoke verifies hashes."
rollback = "Rollback removes tracked workflow, controller, configuration and documentation without mutating runtime data. Ignored report generations, caches and trend records remain available for manual audit and can be deleted separately; no rollback rewrites current.json to fabricate an older result or imports developer state into production."
audit_trail = "Each immutable report manifest records run_id, UTC timestamps, mode, commit/dirty-tree identity, target base, config/tool/environment/execution/comparison/cohort digests, budgets, stop reason, run status, member hashes, cancellation receipt, redaction, cache origins, retention and trend decisions. Recovery records contain no credentials, raw environment values, or production data."

[evidence.concurrency]
ownership = "One mutation controller process owns deterministic planning, a bounded thread pool, one spawn/cancel gate, direct Popen creation, synchronized active-PGID registry, hard and execution monotonic deadlines, signal handling, one report publisher, leases, and cleanup. Each thread owns one bounded bytecode-clean private source tree and restores/hash-checks targets between work items."
bound = "Mode limits are 150/1000/5000 selected mutants and 600/1800/5400 hard wall seconds with 30/60/120 in-budget reserves; scans are 3000/20000/100000 candidates and 3/20/100 million visits; source and dependency limits are finite; each tree is 512 files/8 MiB/10 seconds, aggregate 2048/32 MiB with 512 MiB free; workers max four and native threads one; every output/generation/cache/trend dimension is numeric."
ordering = "Planning order is changed line, changed definition, configured core/defect priority, then repository-relative path, line, column, operator priority/name and occurrence. Completion order never changes serialized report order."
atomicity = "Threads share no mutable source tree. One exact-traversal span-verified first-order mutation is applied to one bytecode-clean private tree. Cache entries are atomic; JSON/Markdown/HTML/manifest stage under one leased run ID before one current pointer publishes the generation; fallback never changes current."
timeout_cancellation = "Baseline and mutant pytest start in parent-owned groups registered under the spawn/cancel gate. Admission requires timeout plus reap before execution deadline. Deadline, worker failure or signal sends TERM/KILL, verifies death, reaps, records cleanup receipt, then publishes within the hard budget. Timeout remains distinct from killed."
backpressure = "The parent admits at most the effective-CPU worker bound with native threads fixed to one, retains a finite queue, checks deadlines during Git/source/AST/dependency/copy/coverage work, reserves cleanup/report time and worst-case structural/escaped report capacity, and truncates details without blocking pipes."
partial_failure = "Baseline failure marks only its exact affected-test tuple baseline-unavailable. Fresh/cache killed and survived, mapping/line no-coverage, invalid, timeout, infrastructure, exception, plan and budget outcomes remain separate; cache hits never inflate executed, every selected mutant has one terminal state, and completed outcomes survive cancellation."
capacity_validation = "Tests force source/file/AST/dependency/visit/candidate/mutant/private-tree/temp-space/native-thread/time/detail/per-file/generation/cache/trend ceilings, spawn-registration cancellation, active-lease cleanup, stale bytecode, descendant timeout, redaction, output overflow, interruption, deterministic truncation and zero/deferred scope."

[[obligations]]
id = "mutation.bounded-execution"
owner = "trade_py/devtools/mutation_testing selection and executor"
paths = [
  "trade_py/devtools/mutation_testing/config.py",
  "trade_py/devtools/mutation_testing/git_scope.py",
  "trade_py/devtools/mutation_testing/selection.py",
  "trade_py/devtools/mutation_testing/executor.py",
  "config/mutation-testing.toml",
  "tests/test_mutation_selection.py",
  "tests/test_mutation_executor.py",
]
contracts = [
  "changed 150 mutants and 600 seconds",
  "core 1000 mutants and 1800 seconds",
  "full 5000 mutants and 5400 seconds",
  "worker max min(4, CPU half)",
  "one native thread per pytest process",
  "finite source, AST, dependency, visit, private-tree and candidate scan",
  "hard and execution deadlines with in-budget cleanup/report reserve",
  "lowering-only overrides and no scope broadening",
]
failure_states = [
  "unresolved base",
  "candidate or mutant budget exhausted",
  "global deadline",
  "unsafe or excluded source",
  "excessive worker request",
  "partial execution",
  "source or dependency capacity refusal",
  "private-tree or report capacity refusal",
]
spec_requirements = [
  "controlled-mutation-testing:Mutation execution SHALL be bounded by mode",
  "controlled-mutation-testing:Mutation target and test selection SHALL remain narrow",
]
validation_tasks = ["1.1", "1.2", "2.2", "2.3", "4.1", "4.2", "4.4"]

