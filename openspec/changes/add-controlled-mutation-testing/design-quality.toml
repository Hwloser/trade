schema_version = 1
policy_version = "v1"

[[impacts]]
id = "public_contract"
applies = true
reason = "Adds the developer-facing scripts/mutation-test changed|core|full command, trade.mutation.report.v1 JSON/Markdown/HTML contract, configuration schemas, exit codes, and GitHub Actions routing without changing runtime product interfaces."

[[impacts]]
id = "persistent_write"
applies = true
reason = "The controller persistently publishes ignored developer report generations, content-addressed result caches, and bounded core/full trend records. These are not runtime business state, but they require explicit single-writer, validation, atomic visibility, corruption, recovery, and rollback semantics."

[[impacts]]
id = "schema_migration"
applies = false
reason = "No business database, payload, parquet, API, or runtime schema changes; versioned mutation report/config formats are additive developer contracts rather than migrated production state."

[[impacts]]
id = "point_in_time"
applies = false
reason = "The change does not compute forecasts, labels, rankings, backtests, snapshots, or point-in-time data and excludes model/research execution from mutation tests."

[[impacts]]
id = "predictive_model"
applies = false
reason = "No model, recommendation, score, calibration, promotion, or trading decision behavior changes; mutation only challenges existing unit tests in temporary source copies."

[[impacts]]
id = "external_event_data"
applies = false
reason = "Mutation workers use synthetic/local unit tests only and do not fetch, ingest, replay, or process news, social, macro, on-chain, provider, or other external event data."

[[impacts]]
id = "runtime_concurrency"
applies = true
reason = "The developer controller owns a bounded worker pool plus independently terminable pytest process groups, global/per-mutant deadlines, cancellation, backpressure, and partial result aggregation."

[evidence.contract]
contract = "scripts/mutation-test changed|core|full with safe-root output, lowering-only budget/worker, plan-only, and cache options; trade.mutation.invocation.v1 binds each run before uv; exit 0 complete/zero-work/deferred-only/plan-only/budget-partial, exit 1 future established comparable regression only, exit 2 preflight/degraded/cancelled/report failure; one trade.mutation.report.v1 generation or trade.mutation.fallback.v1 diagnostic."
consumers = "Repository developers, pull-request GitHub Actions, nightly/manual operators, and future baseline reviewers. Existing runtime CLI, HTTP, Web, SDK, scheduler, event, database, artifact, model, C++ and frontend consumers are unchanged."
compatibility = "The surface is additive and initially non-blocking. Existing pytest remains the test framework. Optional mutation dependencies are not runtime dependencies. Missing or invalid explicit changed base fails closed and never broadens to core/full."
migration = "No migration is required. Reports and caches use versioned schemas/keys and are generated only after explicit invocation. The baseline starts unestablished rather than treating the first run as historical truth."
rollback = "Remove the workflow, wrapper, controller, optional dependency group, configuration, tests and documentation. Ignored reports/caches are disposable; no runtime state or data restoration is needed."

[evidence.storage]
authoritative_writer = "One receipt-bound mutation invocation is the sole writer for its UUID run directory below owned repository .mutation-testing. An output-root lock serializes pointer recovery, retention, publication, cache commits and derived trend reconciliation. Runtime databases, parquet, provider data, and production artifacts are rejected writer targets."
idempotency_key = "A report generation is identified by run_id plus config, source-tree, mapped-definition/test, dependency-environment, platform, command, cohort, and tool digests. Cache entries require complete identity plus source-exact execution_id and a completed-run commit marker; trend is derived idempotently from committed generation run IDs and publication sequence."
concurrency_control = "Each invocation creates an atomic receipt before uv, stages under its unique run_id and holds a PID/start-token/boot-identity lease. A bounded exclusive output-root lock covers corrupt-pointer quarantine, manifest verification, aggregate retention, current-pointer replacement, cache commit and trend reconciliation. Same-key races verify digest/commit marker; scavenging requires non-blocking lease acquisition and 24-hour stale validation."
staging_validation = "The controller validates safe output ownership, redaction, receipt transitions, schema, fresh/cache/plan/cancellation count equations, selected-mutant terminal coverage, per-file/generation/aggregate retention/renderer bounds, source/comparison/cache identities, and report hashes. Cache reads require committed-run markers; trend is rebuilt from validated committed generations."
atomic_visibility = "JSON, Markdown, HTML, and manifest are flushed and fsynced in a private run_id staging directory, renamed to the final run directory, and exposed together only by same-directory fsync plus atomic replacement of current.json. Cache records use write/fsync/rename/directory-fsync; trend uses a staged complete bounded file and atomic replacement."
crash_windows = "A crash before current-pointer replacement leaves the prior generation current and leased staging unreferenced; after replacement it exposes only a validated generation. Publication failure writes one typed receipt-bound fallback without changing current. Cache outcomes remain unreadable without a completed-run marker; trend is reconciled from committed manifests; active leases prevent concurrent cleanup."
corrupt_predecessor = "Corrupt predecessor state fails closed under the publication lock: malformed, oversized, symlinked, path-escaping, missing-generation, identity or hash-mismatched report state is quarantined or fails with a stable repair command. An absent current pointer on the first run is valid; uncommitted or corrupt cache is a miss; corrupt trend is quarantined and rebuilt from committed generations."
partial_results = "Every selected mutant receives one terminal status, including not_run_plan, not_run_budget, cancelled_test_started, not_run_cancelled and infrastructure_error, with fresh/cache origin where applicable. Deadline, signal, baseline and worker degradation publish a marked partial generation when possible. Publication failure preserves staging, writes a typed bounded fallback bound by the invocation receipt, and returns exit 2 without presenting stale current as this run."
reader_consistency = "Readers resolve current.json once, validate its run_id, schema, manifest and member digests, and then read only that immutable generation. They never combine files from different run IDs. Cache and trend readers validate complete identity and digest before use and otherwise behave as a cache miss or explicit trend recovery."
backup_hash_verification = "Report recovery verification uses the manifest SHA-256 and byte size for every member, read back before pointer publication and again before CI uploads the immutable run generation. Cache and trend atomic-write tests read back and hash every record; disposable ignored developer state requires no business-data backup or restore path."
small_sample_verification = "Temporary-directory tests interrupt receipt/cache-commit/report/trend phases, race active leases and same-key writers, inject redaction sentinels, corrupt every pointer state, exceed per-file/generation/aggregate retention bounds, and verify readers see one complete predecessor/successor. Tests prove typed fallback binding and trend rebuild; a lowered-budget smoke verifies hashes."
rollback = "Rollback removes tracked workflow, controller, configuration and documentation without mutating runtime data. Ignored report generations, caches and trend records remain available for manual audit and can be deleted separately; no rollback rewrites current.json to fabricate an older result or imports developer state into production."
audit_trail = "The invocation receipt and immutable manifest record run_id, monotonic deadline, UTC timestamps, mode, commit/dirty-tree identity, target base, config/tool/environment/execution/comparison/cohort digests, budgets, stop/status, hashes, cancellation/guard receipts, redaction, cache commit, retention, pointer recovery and trend projection decisions without credentials or production data."

[evidence.concurrency]
ownership = "One wrapper watchdog creates the receipt/deadline before uv; one controller owns deterministic planning, bounded threads, spawn/cancel gate, direct Popen, synchronized PGID registry, hard/execution deadlines, signal handling, report store, leases, and cleanup. Each thread owns one bounded bytecode-clean import-closure tree and restores/hash-checks targets."
bound = "Mode limits are 150/1000/5000 selected mutants and 600/1800/5400 hard wall seconds with 30/60/120 in-budget reserves; scans are 3000/20000/100000 candidates and 3/20/100 million visits; source and dependency limits are finite; each tree is 512 files/8 MiB/10 seconds, aggregate 2048/32 MiB with 512 MiB free; workers max four and native threads one; every output/generation/cache/trend dimension is numeric."
ordering = "Planning order is changed line, changed definition, configured core/defect priority, then repository-relative path, line, column, operator priority/name and occurrence. Completion order never changes serialized report order."
atomicity = "Threads share no mutable tree. One operator-local span-verified mutation is applied to one bytecode-clean closure tree. Cache outcomes stage until a completed-run marker; JSON/Markdown/HTML/manifest stage under one leased run ID before one pointer publishes; fallback never changes current and trend derives from committed generations."
timeout_cancellation = "Baseline and mutant pytest start in parent-owned groups registered under the spawn/cancel gate. Admission requires timeout plus reap before execution deadline. Deadline, worker failure or signal sends TERM/KILL, verifies death, reaps, records cleanup; timeout, cancelled-active and not-run-cancelled remain distinct from killed/infrastructure."
backpressure = "The parent admits at most the effective-CPU worker bound with native threads fixed to one, retains a finite queue, checks deadlines during Git/source/AST/dependency/copy/coverage work, reserves cleanup/report time and worst-case structural/escaped report capacity, and truncates details without blocking pipes."
partial_failure = "Baseline failure marks only its tuple unavailable. Fresh/cache killed/survived, no-coverage, invalid, timeout, infrastructure, isolation violation, cancelled-active, plan/budget/cancelled-not-run stay separate; cache hits never inflate executed, every selected mutant terminates, and completed outcomes survive cancellation."
capacity_validation = "Tests force source/AST/import-closure/visit/candidate/mutant/private-tree/temp/native-thread/time/detail/per-file/generation/aggregate retention/cache/trend ceilings, 10x unrelated modules, cross-uv deadline, spawn cancellation, active lease cleanup, stale bytecode, guard sidecars, descendant timeout, redaction, interruption and deterministic truncation."

[[obligations]]
id = "mutation.bounded-execution"
owner = "trade_py/devtools/mutation_testing selection, process supervisor and scheduler"
paths = [
  "scripts/mutation-test",
  "trade_py/devtools/mutation_testing/bootstrap.py",
  "trade_py/devtools/mutation_testing/config.py",
  "trade_py/devtools/mutation_testing/git_scope.py",
  "trade_py/devtools/mutation_testing/selection.py",
  "trade_py/devtools/mutation_testing/process_supervisor.py",
  "trade_py/devtools/mutation_testing/executor.py",
  "config/mutation-testing.toml",
  "tests/test_mutation_selection.py",
  "tests/test_mutation_executor.py",
]
contracts = [
  "changed 150 mutants and 600 seconds",
  "core 1000 mutants and 1800 seconds",
  "full 5000 mutants and 5400 seconds",
  "worker max min(4, CPU half)",
  "one native thread per pytest process",
  "finite source, AST, dependency, visit, private-tree and candidate scan",
  "one wrapper deadline across uv handoff plus execution deadline and in-budget reserve",
  "lowering-only overrides and no scope broadening",
]
failure_states = [
  "unresolved base",
  "candidate or mutant budget exhausted",
  "global deadline",
  "unsafe or excluded source",
  "excessive worker request",
  "partial execution",
  "source or dependency capacity refusal",
  "private-tree or report capacity refusal",
]
spec_requirements = [
  "controlled-mutation-testing:Mutation execution SHALL be bounded by mode",
  "controlled-mutation-testing:Mutation target and test selection SHALL remain narrow",
]
validation_tasks = ["1.1", "1.2", "2.2", "2.3", "4.1", "4.2", "4.4"]

