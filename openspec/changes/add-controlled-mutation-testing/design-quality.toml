]
contracts = [
  "exact Cosmic Ray operator allowlist",
  "exact Cosmic Ray 8.4.6 get_operator plus mutate_code API",
  "one mutation specification per work item",
  "occurrence and source-span handshake before mutation",
  "deterministic location-prioritized selection",
