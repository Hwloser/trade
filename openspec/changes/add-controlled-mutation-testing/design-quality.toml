schema_version = 1
policy_version = "v1"

[[impacts]]
id = "public_contract"
applies = true
reason = "Adds canonical trade dev mutation changed|core|full plus qualify/inspect/repair, an argv-compatible scripts/mutation-test facade, trade.mutation report/receipt/fallback/bundle/capacity contracts, exit codes, and GitHub Actions routing without changing runtime product interfaces."

[[impacts]]
id = "persistent_write"
applies = true
reason = "The controller persistently publishes ignored developer report generations, content-addressed result caches, and bounded core/full trend records. These are not runtime business state, but they require explicit single-writer, validation, atomic visibility, corruption, recovery, and rollback semantics."

[[impacts]]
id = "schema_migration"
applies = false
reason = "No business database, payload, parquet, API, or runtime schema changes; versioned mutation report/config formats are additive developer contracts rather than migrated production state."

[[impacts]]
id = "point_in_time"
applies = false
reason = "The change does not compute forecasts, labels, rankings, backtests, snapshots, or point-in-time data and excludes model/research execution from mutation tests."

[[impacts]]
id = "predictive_model"
applies = false
reason = "No model, recommendation, score, calibration, promotion, or trading decision behavior changes; mutation only challenges existing unit tests in temporary source copies."

[[impacts]]
id = "external_event_data"
applies = false
reason = "Mutation workers use synthetic/local unit tests only and do not fetch, ingest, replay, or process news, social, macro, on-chain, provider, or other external event data."

[[impacts]]
id = "runtime_concurrency"
applies = true
reason = "The developer controller owns a bounded worker pool plus independently terminable pytest process groups, global/per-mutant deadlines, cancellation, backpressure, and partial result aggregation."

[evidence.contract]
contract = "Canonical trade dev mutation changed|core|full plus qualify/inspect/repair, with scripts/mutation-test argv/exit compatibility, safe-root output, lowering-only budget/worker, plan-only, and cache options; a Python 3.7 stdlib supervisor creates trade.mutation.invocation.v1 before uv; exit 0 complete/zero-work/deferred-only/plan-only/budget-partial, exit 1 future established comparable regression only, exit 2 preflight/degraded/cancelled/report failure; one root-hash-bound trade.mutation.report.v1 generation or trade.mutation.fallback.v1 diagnostic and one validated trade.mutation.bundle.v1 in CI."
consumers = "Repository developers, pull-request GitHub Actions, nightly/manual operators, and future baseline reviewers. Existing runtime CLI, HTTP, Web, SDK, scheduler, event, database, artifact, model, C++ and frontend consumers are unchanged."
compatibility = "The surface is additive and initially non-blocking. Existing pytest remains the test framework. Optional mutation dependencies are not runtime dependencies. Missing or invalid explicit changed base fails closed and never broadens to core/full."
migration = "No migration is required. Reports and caches use versioned schemas/keys and are generated only after explicit invocation. The baseline starts unestablished rather than treating the first run as historical truth."
rollback = "Remove the workflow, wrapper, controller, optional dependency group, configuration, tests and documentation. Ignored reports/caches are disposable; no runtime state or data restoration is needed."

[evidence.storage]
authoritative_writer = "The Python 3.7 stdlib supervisor is the sole invocation-receipt and controller-loss-fallback writer; one receipt-bound controller is the sole writer for its UUID run staging/final generation below owned repository .mutation-testing. An output-root lock serializes sequence reservation, pointer recovery, retention, report publication and post-publication cache/trend projections. Landlock rejects runtime databases, parquet, provider data, and production artifacts."
idempotency_key = "A report generation is identified by run_id plus config, import-closure, mapped-definition/test, dependency-environment, platform, command, cohort, and tool digests. Cache entries require closure identity plus source-exact execution_id and a post-publication commit marker. Trend uses a pre-reserved monotonic sequence, high-water/checkpoint and content-addressed source/tombstone hash chain. CI bundles bind exact receipt and evidence roots."
concurrency_control = "The supervisor creates receipt/deadline before uv, becomes subreaper, owns fork-stop cgroup/session admission, pidfd identities, signal forwarding, continued cleanup and fallback. The controller stages under run_id and holds a PID/start-token/boot lease. One output lock covers quarantine, sequence reservation, manifest-root publication, retention, cache commit, trend source/tombstone/high-water and reconciliation. Repair takes the same lock and defaults dry-run."
staging_validation = "The controller validates safe output ownership, redaction, receipt transitions, exact pass-FD closure and SCM_RIGHTS handoff, independent child guard and controller-private syscall-audit lifecycles, the closed sixteen-status and phase-count algebra, per-file/generation/receipt/ledger/aggregate/renderer bounds, source/comparison/cache identities, member hashes, and non-self manifest root. Cache reads require markers; trend validates chain; CI validates trade.mutation.bundle.v1."
atomic_visibility = "JSON, Markdown and HTML are flushed/fsynced; manifest hashes every other member; publication sequence is reserved/fsynced before current.json and the supervisor receipt anchor manifest hash, byte size and sequence. Cache markers and trend source/tombstone/high-water records are idempotent post-publication projections; trend.jsonl is atomically rebuilt. CI bundles have a read-back-verified manifest."
crash_windows = "A crash before current-pointer replacement leaves the prior generation current and leased staging unreferenced; after replacement it exposes one root-verified generation. Unresolved sequence reservations reconcile to a matching source or tombstone before reuse. Controller loss leaves supervisor-owned cleanup plus root or fallback evidence. Cache/trend projection failure leaves report truth and a receipt gap; active leases prevent cleanup."
corrupt_predecessor = "Corrupt predecessor state fails closed under the publication lock: malformed, oversized, symlinked, path-escaping, missing-generation, identity, root, member, sequence high-water, checkpoint or hash-chain mismatch is quarantined or yields exact inspect and dry-run/apply repair commands. First pointer/epoch absence is explicit; corrupt cache is a miss; missing aggregate starts predecessor_unavailable rather than fabricated continuity."
partial_results = "Every selected mutant receives exactly one closed terminal status plus mutation-applied and test-started facts. Deadline, signal, baseline and worker degradation publish a marked partial generation when possible. Projection degradation remains visible in the receipt without rewriting report truth; publication failure preserves staging and writes a typed bounded fallback."
reader_consistency = "Readers resolve one receipt/current pointer, verify its manifest root then member hashes, and read one immutable generation. Cache readers require closure identity and commit marker; trend readers validate compact source records and expose gaps instead of treating a truncated projection as complete."
backup_hash_verification = "Report recovery verifies manifest SHA-256/size/sequence from receipt/current and every member hash. CI constructs and read-back verifies an immutable receipt/evidence/validation bundle. Cache markers, trend source/tombstone/high-water/checkpoint and rolling aggregates are hashed; disposable ignored developer state requires no business-data backup."
small_sample_verification = "Temporary-root tests interrupt receipt/report/sequence/pointer/cache/trend/bundle phases, kill the controller, race leases/same-key writers, corrupt every pointer/root/chain/aggregate state, and verify predecessor/successor or explicit epoch gap. They exercise inspect/repair schemas/exits, retention coupling, closed algebra, capacity identity, bundle binding and lowered-budget roots."
rollback = "Rollback removes tracked workflow, controller, configuration and documentation without mutating runtime data. Ignored report generations, caches and trend records remain available for manual audit and can be deleted separately; no rollback rewrites current.json to fabricate an older result or imports developer state into production."
audit_trail = "The phase-journal receipt, immutable manifest, trend chain, capacity record and CI bundle record run_id, deadlines, mode, commit/dirty-tree/base, config/tool/environment/execution/comparison/cohort/runner digests, budgets, phase facts, stop/status/cleanup, pass-FD and broker policy, independent guard/audit lifecycles, cancellation, cache/retention/pointer/sequence/aggregate decisions without credentials or production data."

[evidence.concurrency]
ownership = "One Python 3.7 stdlib supervisor creates receipt/deadline before uv and owns fork-stop cgroup/session admission, pidfds, subreaping, signal forwarding, continued cleanup and fallback. One controller owns planning, bounded threads, spawn requests, seccomp listener, brokered-open decisions, private syscall audit, and synchronized pidfd/PGID/cgroup/typed-transition registry. Each thread owns one bytecode-clean closure tree; child only owns a write-only guard channel."
bound = "Mode limits are 150/1000/5000 selected mutants and 600/1800/5400 controller seconds with 30/60/120 in-budget reserves; scans are 3000/20000/100000 candidates and 3/20/100 million visits; source/dependency/tree/output bounds are finite. Workers use min(4, floor(effective CPU/2)) plus tuple-specific finite cgroup memory reservations; absent enforceable memory forces local one worker and rejects CI/qualification. Native threads are one."
ordering = "Changed admits exact changed lines only; core/full use configured definition priority, then repository-relative path, line, column, operator priority/name and occurrence. Completion order never changes serialization. Trend uses pre-reserved sequence and hash chain; CI aggregate restore uses numeric workflow run ID."
atomicity = "Threads share no mutable tree. One operator-local span-verified mutation is applied to one closure tree. Typed mutation-applied/test-started/stop events linearize phase truth. JSON/Markdown/HTML plus non-self manifest publish under one leased run ID and reserved sequence; cache/trend projections follow; supervisor fallback and CI bundle never change current."
timeout_cancellation = "Baseline/mutant pytest run in owned cgroups/groups; typed events linearize natural exit, integrity, timeout, budget and signal at every phase. Admission requires ordinary timeout plus cleanup before execution deadline. Controller and supervisor use pidfd/cgroup/TERM/KILL/observable reap; uninterruptible tasks become cleanup_unconfirmed and outer CI timeout is final containment."
backpressure = "Admission uses CPU plus each active tuple's measured memory reservation, native threads one, finite queue, deadline checks during Git/source/AST/dependency/copy/coverage, cleanup/report reserve and worst-case report capacity. Identity/freshness/headroom-bound cold core/full qualification and bounded CI bundle/aggregate storage are required before schedules."
partial_failure = "Baseline failure marks only its tuple unavailable. Closed terminal and phase facts keep kills/survivors, no-coverage, invalid, timeout, infrastructure, cancellation, cleanup-unconfirmed and not-run distinct. Supervisor loss fallback, projection gaps and trend epoch breaks remain explicit and never rewrite report truth."
capacity_validation = "Tests force source/AST/closure/visit/candidate/mutant/tree/temp/native-thread/tuple-memory/time/detail/generation/receipt/ledger/cache/bundle ceilings, pre-uv Python/deadline, fork-stop cgroup admission, controller SIGKILL/OOM, cleanup-unconfirmed, every typed stop race, SCM_RIGHTS and brokered open, independent guard/audit streams, capacity freshness/identity, rolling aggregate chain, redaction and interruption."

[[obligations]]
