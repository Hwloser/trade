schema_version = 1
policy_version = "v1"

[[impacts]]
id = "public_contract"
applies = true
reason = "Adds canonical trade dev mutation changed|core|full plus qualify/inspect/repair/reconcile, an argv-compatible scripts/mutation-test facade, trade.mutation report/receipt/fallback/bundle/baseline/capacity contracts, exit codes, and GitHub Actions routing without changing runtime product interfaces."

[[impacts]]
id = "persistent_write"
applies = true
reason = "The report store persistently publishes ignored developer report generations, while scheduled core/full projection owners may publish content-addressed result caches and bounded trend carriers. The supervisor separately owns receipts, sealed attestation journals, and fallbacks. These are not runtime business state, but they require explicit single-writer, validation, atomic visibility, corruption, recovery, and rollback semantics."

[[impacts]]
id = "schema_migration"
applies = false
reason = "No business database, payload, parquet, API, or runtime schema changes; versioned mutation report/config formats are additive developer contracts rather than migrated production state."

[[impacts]]
id = "point_in_time"
applies = false
reason = "The change does not compute forecasts, labels, rankings, backtests, snapshots, or point-in-time data and excludes model/research execution from mutation tests."

[[impacts]]
id = "predictive_model"
applies = false
reason = "No model, recommendation, score, calibration, promotion, or trading decision behavior changes; mutation only challenges existing unit tests in temporary source copies."

[[impacts]]
id = "external_event_data"
applies = false
reason = "Mutation workers use synthetic/local unit tests only and do not fetch, ingest, replay, or process news, social, macro, on-chain, provider, or other external event data."

[[impacts]]
id = "runtime_concurrency"
applies = true
reason = "The developer application owns a bounded logical worker pool while the sole-spawner supervisor owns independently terminable pytest process groups, global/per-mutant deadlines, priority cancellation and cleanup control, backpressure, and partial result aggregation."

[evidence.contract]
contract = "Canonical trade dev mutation changed|core|full plus qualify, bundle-or-run inspect, repair, and carrier-aware reconcile, with scripts/mutation-test argv/exit compatibility, safe-root output, lowering-only budget/worker, plan-only, and cache options; parser-only cli.py delegates to application.py over a complete acyclic module graph; bootstrap emits one BootstrapResultV1, the Python 3.7 stdlib sole-spawner supervisor verifies and seals it in a read-only memfd, and exactly one application consumes it and invokes the sole report-store owner; the supervisor creates trade.mutation.invocation.v1 and a bounded terminally sealed supervisor-only attestation journal before uv; exit 0 complete/zero-work/deferred-only/plan-only/budget-partial, exit 1 future established comparable regression only, exit 2 preflight/degraded/cancelled/report failure; one root-hash-bound trade.mutation.report.v1 generation or supervisor-owned trade.mutation.fallback.v1 diagnostic and one bounded cross-job validated trade.mutation.bundle.v1 in CI."
consumers = "Repository developers, pull-request GitHub Actions, nightly/manual operators, and future baseline reviewers. Existing runtime CLI, HTTP, Web, SDK, scheduler, event, database, artifact, model, C++ and frontend consumers are unchanged."
compatibility = "The surface is additive and initially non-blocking. Existing pytest remains the test framework. Optional mutation dependencies are not runtime dependencies. Missing or invalid explicit changed base fails closed and never broadens to core/full."
migration = "No migration is required. Reports and caches use versioned schemas/keys and are generated only after explicit invocation. The baseline starts unestablished rather than treating the first run as historical truth."
rollback = "Remove the workflow, wrapper, controller, optional dependency group, configuration, tests and documentation. Ignored reports/caches are disposable; no runtime state or data restoration is needed."

[evidence.storage]
authoritative_writer = "The Python 3.7 stdlib supervisor is the sole OS child spawner, invocation-receipt writer, terminally sealed supervisor-attestation-journal writer, and writer of every fallback. Before sharing the channel capability it establishes and reads back PR_SET_DUMPABLE=0, private controller PID/procfs visibility, empty capabilities, no supervisor pidfd, process-control syscall denials, and filesystem write denial. Bootstrap owns only one BootstrapResultV1 transition write; application.py consumes the supervisor-sealed DTO once and alone coordinates the report-store use case; report_store.py is the sole writer for the UUID staging/final generation below owned repository .mutation-testing. An output-root lock serializes report publication and projections. Only scheduled core/full own shared trend/cache/aggregate writes; changed and manual runs perform no remote carrier read or write, while an environment-approved reconcile route may publish one validated repaired carrier."
idempotency_key = "A report generation is identified by run_id plus sealed GitScopeSnapshot, config, import-closure, mapped-definition/test, dependency-environment, platform, command, cohort, and tool digests. Supervisor attestation entries form a run-bound hash chain whose final schema/head/count/sequence/byte-size/sealed anchor is atomically bound into the receipt or fallback. Cache entries require closure identity plus source-exact execution_id and a post-publication score-eligible commit marker. Report and trend have independent monotonic sequences; each scheduled trend epoch binds one reviewed genesis marker and protected create-only GenesisConsumptionReceipt ref, high-water/checkpoint, and content-addressed source/tombstone hash chain. CI bundles bind the exact receipt, complete sealed journal, and evidence roots."
concurrency_control = "The supervisor creates receipt/CLOCK_BOOTTIME deadlines before uv, becomes subreaper, owns bounded channel-authenticated spawn/signal/wait/fallback/seal requests, source-exclusive attestation, opaque handles, fork-stop delegated-cgroup/session admission, pidfds, signal forwarding, continued cleanup and fallback. Work uses a 2*workers lane while a higher-priority 2*workers+8 control lane reserves termination, wait/reap, cancellation, shutdown, fallback, and seal capacity. Successful OS child creation is journaled before registration. Bootstrap writes one DTO that the supervisor seals and one application consumes; the application stages under run_id and holds a boot-bound lease but cannot spawn or write supervisor roots. One output lock covers quarantine, separate report/trend sequence reservation, manifest-root publication, retention, cache commit, trend source/tombstone/high-water/genesis consumption and reconciliation. Repair/reconcile take the same lock and default dry-run."
staging_validation = "The application validates safe output ownership, sealed Git scope, redaction, one-use BootstrapResultV1, receipt transitions, exact pass-FD closure and SCM_RIGHTS handoff, supervisor-attestation final anchor and complete journal, controller-private syscall-audit lifecycle, normal drain or freeze/drain/terminate/final-drain forced close, sticky integrity plus cleanup override, the closed fifteen-status mutation/worker-spawned/worker-registered/test/cleanup matrix, phase algebra, nine-state run precedence and score precedence including incomplete_outcome, CoverageTupleEvidenceV1, per-file/generation/receipt/journal/bundle/aggregate/renderer bounds, source/comparison/cache identities, member hashes, and non-self manifest root. Cache reads require score-eligible markers; scheduled trend validates the protected genesis consumption ref and chain; CI independently revalidates downloaded trade.mutation.bundle.v1 bytes."
atomic_visibility = "Ordinary supervisor attestation entries are bounded append-and-ACK hash-chain records; forced-close boundaries, fallback and the single terminal seal are fdatasynced. The supervisor then atomically binds journal schema/head/count/final-sequence/byte-size/sealed=true into the receipt or fallback, so a legal prefix, torn tail, extra post-seal byte, or crash before seal is invalid. JSON, Markdown and HTML are flushed/fsynced; manifest hashes every other member; report sequence is reserved/fsynced before current.json and the supervisor receipt anchors manifest hash, byte size and sequence. Scheduled-only cache markers and independent core/full trend source/tombstone/high-water records are idempotent post-publication projections; first publication requires protected-ref CAS plus read-back of GenesisConsumptionReceipt; trend.jsonl is atomically rebuilt. CI bundles have a read-back-verified manifest and cross-job artifact digest."
crash_windows = "A bootstrap crash or malformed/trailing/replayed DTO never starts application. A journal crash before terminal seal is incomplete evidence and cannot be repaired by accepting a valid prefix. A crash before current-pointer replacement leaves the prior generation current and leased staging unreferenced; after replacement it exposes one root-verified generation. An unresolved report reservation commits only when current.json exactly matches run/sequence/root/size, otherwise tombstones. Controller loss leaves supervisor-owned cleanup plus sealed root or fallback evidence. Cache/trend projection failure leaves report truth and a receipt gap; protected genesis consumption is never deleted or reused; active leases prevent cleanup."
corrupt_predecessor = "Corrupt predecessor state fails closed under the publication lock: malformed, oversized, symlinked, path-escaping, missing-generation, identity, root, member, sequence high-water, checkpoint, protected genesis-consumption ref, or hash-chain mismatch is quarantined or yields actual-root run/bundle inspect and explicit-carrier dry-run/apply repair/reconcile commands. First no-predecessor publication is permitted only after atomic create/read-back of the absent protected consumption ref with identical bytes under concurrent CAS. An absent, mutable, mismatched, or unverifiably unused ref is predecessor_invalid; later missing aggregate is predecessor_unavailable; corrupt highest never silently falls back."
partial_results = "Every selected mutant receives exactly one closed terminal plus mutation-applied/worker-spawned/worker-registered/test-started facts and orthogonal cleanup. Sticky integrity or unconfirmed cleanup replaces provisional natural/timeout/cancel outcomes with phase-appropriate infrastructure. Any timeout, cancellation, baseline-unavailable, invalid, infrastructure, plan, budget, or other not-run terminal sets score reason incomplete_outcome unless a higher-precedence reason applies; factual numerator/denominator remain auditable while displayed score is null and cache/baseline/trend/aggregate writes are forbidden. Only a complete killed/survived/independently recomputed no-coverage/exact-equivalent-exception partition is score eligible. Projection degradation remains visible in the receipt without rewriting report truth; publication failure preserves staging and asks the supervisor for a typed bounded fallback."
reader_consistency = "Readers resolve one receipt/current pointer, verify the journal schema/head/count/final-sequence/byte-size/sealed anchor against the complete supervisor attestation, verify manifest root/member hashes, and read one immutable generation. Raw receipt+sealed-attestation+report-or-fallback+expected-bundle evidence expires as one invocation-kind-aware unit; local bundle expectation is explicitly not_applicable while CI is required. Separately retained compact trend anchors expose detail_evidence=expired and cannot establish baseline or detailed comparability. Cache readers require closure identity and score-eligible commit marker; trend readers validate protected reviewed genesis consumption plus compact source records and expose gaps until explicit carrier-aware reconcile."
backup_hash_verification = "Report recovery verifies the complete sealed supervisor attestation chain and final anchor, manifest SHA-256/size/report-sequence from receipt/current, and every member hash. CI execution constructs/read-back verifies a mode-bounded immutable receipt/attestation/evidence/validation bundle, uploads exact bytes, and the next job independently downloads/recomputes it. Baselines reopen a verified score-eligible bundle and recompute key sets/counts/score. Cache markers, protected GenesisConsumptionReceipt refs, trend source/tombstone/high-water/checkpoint and rolling aggregates are hashed; disposable ignored developer state requires no business-data backup."
small_sample_verification = "Temporary-root tests interrupt bootstrap/receipt/attestation-seal/report-sequence/pointer/cache/genesis-CAS/trend-sequence/bundle phases, fail child registration, kill the controller, race leases/same-key writers, saturate separate work/control lanes and journal ordinary/reserve capacity, reject valid-prefix/torn/post-seal journals, inject forced-close notification races, corrupt every pointer/root/chain/highest aggregate state, rerun an old workflow tuple, and verify predecessor-invalid/unavailable/non-monotonic or explicit-carrier reconcile. They exercise all CLI schemas/exits and actual-root remediation round trips, custom output roots, bundle inspection, local-versus-CI retention, mixed-run null-score algebra, finite bootstrap memory, changed zero-remote 15-minute equation, dual-resource core/full 45/110 qualification, protected genesis CAS, complete quota pagination, and the full valid/invalid/missing/hard-loss/controller-exit summary table."
rollback = "Rollback removes tracked workflow, controller, configuration and documentation without mutating runtime data. Ignored report generations, caches and trend records remain available for manual audit and can be deleted separately; no rollback rewrites current.json to fabricate an older result or imports developer state into production."
audit_trail = "The phase-journal receipt, source-exclusive terminally sealed supervisor attestation journal and final anchor, immutable manifest, protected GenesisConsumptionReceipt and trend chain, dual-resource capacity record and CI bundle record run_id, CLOCK_BOOTTIME/boot ID deadlines, mode, sealed Git scope, config/tool/environment/execution/comparison/cohort/runner digests, budgets, spawned/registered/test phase facts, score eligibility, stop/status/cleanup, process-control isolation, spawn-handle/FD/broker/freeze-drain policy, independent guard/audit lifecycles, cancellation, invocation-kind retention, remote inventory completeness, and report/trend/aggregate decisions without credentials or production data."

[evidence.concurrency]
ownership = "One Python 3.7 stdlib supervisor creates receipt/deadline before uv and alone owns OS spawn, source-exclusive bounded hash-chained attestation and terminal seal, authenticated work/control lanes, opaque handles, fork-stop delegated-cgroup/session admission, pidfds, subreaping, signal/wait/reap, child guard read end/verification/forced-close, continued cleanup and every fallback. Bootstrap owns one BootstrapResultV1 write; the supervisor validates and seals it; one non-spawning application consumes it once and owns planning, bounded logical threads, seccomp listener, brokered-open decisions, private syscall audit, typed outcomes, and report-store invocation but cannot write supervisor roots. application.py alone coordinates use cases; report_store.py alone publishes generations; cli.py only parses/renders. Each thread owns one bytecode-clean closure tree; child owns only its guard writer."
bound = "Mode limits are 150/1000/5000 generated/selected mutants and 600/1800/5400 controller seconds with 30/60/120 in-budget reserves; scans are separately 3000/20000/100000 positions and 3/20/100 million visits; source/dependency/tree/output/remote-restore bounds are finite. Changed and manual remote list/read/download are zero. Attestation journal bounds are 4096 bytes per entry, 2048/12288/61440 entries and 8/48/192 MiB with a reserved 32 entries/128 KiB terminal lane; complete bundle bounds are 64/160/416 MiB. First measurements use finite identity-bound 512-MiB controller and 1024-MiB baseline caps; later workers use min(4, floor(effective CPU/2)) plus measured, enforced cgroup v2 memory.max/high/swap/pids and fixed reserves. Absent delegated finite cgroup/freezer is plan-only. Native threads are one."
ordering = "Changed admits only CanonicalMutationPositionV1 on exact changed lines under a sealed GitScopeSnapshot; core/full use configured definition priority, then repository-relative path, byte position, operator priority/name and execution occurrence. Completion order never changes serialization. Report and trend use separate sequences; only scheduled core/full may list/restore carriers, atomically consume the protected reviewed genesis ref, and reserve shared trend. Manual/changed cannot read shared carriers or advance high-water. CI aggregate and approved reconcile publication use numeric workflow-run-ID/run-attempt and refuse a tuple not strictly newer than its validated predecessor."
atomicity = "Threads share no mutable tree. One operator-local position-verified mutation is applied to one closure tree. Successful OS spawn is attested before registration; every spawned child has confirmed or unconfirmed cleanup. Sticky integrity and final cleanup override provisional control events in the closed phase matrix, while factual score counts remain and score eligibility controls projections. Freeze/drain/terminate-without-unfreeze/wait/final-drain/seal closes forced termination without an enqueue window. JSON/Markdown/HTML plus non-self manifest publish under one leased run ID and report sequence; scheduled-only cache/trend projections follow protected genesis CAS; supervisor fallback and cross-job CI bundle never change current."
timeout_cancellation = "Baseline/mutant pytest run in supervisor-owned cgroups/groups; events use CLOCK_BOOTTIME, control events are provisional, integrity is sticky dominant after normal listener drain or a supervisor-owned freeze/drain/terminate-without-unfreeze/wait-reap/final-drain attestation, and cleanup unconfirmed forces infrastructure. Admission requires ordinary timeout plus cleanup before execution deadline. Application requests by opaque handle through the reserved control lane; supervisor uses pidfd/cgroup/TERM/KILL/observable reap; changed 2+10+2+1, core 4+3+30+5+3, and full 4+3+90+10+3 outer equations are final containment."
backpressure = "Admission uses worker slots plus finite bootstrap and enforced measured per-worker memory reservations; deterministic list scheduling admits a tuple only when both a slot and sum(concurrent memory.max) at or below 80% effective memory are available. Native threads are one; protocol frames are 64 KiB/JSON 48 KiB/eight FDs, with at most workers in-flight/active handles, a 2*workers work lane, and a reserved higher-priority 2*workers+8 cancellation/wait/fallback/seal lane. Journal ordinary and terminal reserves, deadline checks during Git/source/AST/dependency/copy/coverage, cleanup/report/bundle/upload reserves, mode bundle caps, and worst-case disk capacity are finite. Changed requires readiness plus one exact cold-cache zero-remote smoke; scheduled core/full require representative dual-resource tuple qualification. Namespace-aware complete producer inventories and an externally provisioned disposable runner are required before shared uploads or execution routes."
partial_failure = "Baseline failure marks only its tuple unavailable with a closed reason and never increments mutant timeout. Closed terminal/phase/cleanup facts keep kills/survivors, no-coverage, exact equivalent exceptions, invalid, timeout, infrastructure, cancellation and not-run distinct; cleanup unconfirmed is orthogonal but forces infrastructure. Any mixed incomplete partition retains factual counts, reports null score with incomplete_outcome, and cannot publish cache/baseline/trend/aggregate state. Supervisor loss fallback, projection gaps and predecessor-invalid/unavailable epochs remain explicit and never rewrite report truth."
capacity_validation = "Tests force source/AST/closure/visit/scanned/generated/tree/temp/native-thread/bootstrap/per-worker-memory/time/detail/generation/receipt/journal-entry/journal-reserve/bundle/restore/upload-quota ceilings, pre-uv Python/CLOCK_BOOTTIME, one-use BootstrapResultV1, separate work/control lane saturation, private PID/procfs and process-control denial, spawn-before-registration cleanup, fork-stop delegated cgroup/freezer admission, unique-cgroup OOM, sticky integrity/score/cleanup precedence, forced-close notification races, SCM_RIGHTS and brokered open, supervisor guard/controller audit streams, changed zero-remote smoke plus tuple-stratified dual-resource scheduled capacity equations, protected genesis CAS and aggregate invalid/unavailable/non-monotonic predecessor, 15/91 namespace inventory pagination, cross-job bundle inspection, full controller-exit truth table and valid/invalid/missing/hard-loss CI-summary validation, actual-root remediation, redaction and interruption."

