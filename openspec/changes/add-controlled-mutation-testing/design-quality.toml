schema_version = 1
policy_version = "v1"

[[impacts]]
id = "public_contract"
applies = true
reason = "Adds the developer-facing scripts/mutation-test changed|core|full command, trade.mutation.report.v1 JSON/Markdown/HTML contract, configuration schemas, exit codes, and GitHub Actions routing without changing runtime product interfaces."

[[impacts]]
id = "persistent_write"
applies = true
reason = "The controller persistently publishes ignored developer report generations, content-addressed result caches, and bounded core/full trend records. These are not runtime business state, but they require explicit single-writer, validation, atomic visibility, corruption, recovery, and rollback semantics."

[[impacts]]
id = "schema_migration"
applies = false
reason = "No business database, payload, parquet, API, or runtime schema changes; versioned mutation report/config formats are additive developer contracts rather than migrated production state."

[[impacts]]
id = "point_in_time"
applies = false
reason = "The change does not compute forecasts, labels, rankings, backtests, snapshots, or point-in-time data and excludes model/research execution from mutation tests."

[[impacts]]
id = "predictive_model"
applies = false
reason = "No model, recommendation, score, calibration, promotion, or trading decision behavior changes; mutation only challenges existing unit tests in temporary source copies."

[[impacts]]
id = "external_event_data"
applies = false
reason = "Mutation workers use synthetic/local unit tests only and do not fetch, ingest, replay, or process news, social, macro, on-chain, provider, or other external event data."

[[impacts]]
id = "runtime_concurrency"
applies = true
reason = "The developer controller owns a bounded worker pool plus independently terminable pytest process groups, global/per-mutant deadlines, cancellation, backpressure, and partial result aggregation."

[evidence.contract]
contract = "scripts/mutation-test changed|core|full plus inspect/repair with safe-root output, lowering-only budget/worker, plan-only, and cache options; a stdlib supervisor creates trade.mutation.invocation.v1 before uv; exit 0 complete/zero-work/deferred-only/plan-only/budget-partial, exit 1 future established comparable regression only, exit 2 preflight/degraded/cancelled/report failure; one root-hash-bound trade.mutation.report.v1 generation or trade.mutation.fallback.v1 diagnostic."
consumers = "Repository developers, pull-request GitHub Actions, nightly/manual operators, and future baseline reviewers. Existing runtime CLI, HTTP, Web, SDK, scheduler, event, database, artifact, model, C++ and frontend consumers are unchanged."
compatibility = "The surface is additive and initially non-blocking. Existing pytest remains the test framework. Optional mutation dependencies are not runtime dependencies. Missing or invalid explicit changed base fails closed and never broadens to core/full."
migration = "No migration is required. Reports and caches use versioned schemas/keys and are generated only after explicit invocation. The baseline starts unestablished rather than treating the first run as historical truth."
rollback = "Remove the workflow, wrapper, controller, optional dependency group, configuration, tests and documentation. Ignored reports/caches are disposable; no runtime state or data restoration is needed."

[evidence.storage]
authoritative_writer = "One receipt-bound mutation invocation is the sole writer for its UUID run directory below owned repository .mutation-testing. An output-root lock serializes pointer recovery, retention, report publication and post-publication cache/trend-source projections. Landlock rejects runtime databases, parquet, provider data, and production artifacts as worker targets."
idempotency_key = "A report generation is identified by run_id plus config, import-closure, mapped-definition/test, dependency-environment, platform, command, cohort, and tool digests. Cache entries require closure identity plus source-exact execution_id and a post-publication commit marker; trend derives from immutable root-hash-bound source records and publication sequence."
concurrency_control = "A stdlib supervisor creates the receipt/deadline before uv, becomes child subreaper, owns uv sessions and optionally an invocation cgroup, while the controller stages under run_id and holds a PID/start-token/boot lease. One output lock covers quarantine, manifest-root publication, retention, cache commit, trend-source append and reconciliation. Repair takes the same lock and defaults dry-run."
staging_validation = "The controller validates safe output ownership, redaction, receipt transitions, exact pass-FD closure, authenticated gap-free child guard and controller syscall-audit lifecycles, the closed sixteen-status and phase-count algebra, per-file/generation/ledger/aggregate/renderer bounds, source/comparison/cache identities, member hashes, and the non-self-referential manifest root. Cache reads require post-publication markers; trend rebuilds from compact immutable source records."
atomic_visibility = "JSON, Markdown and HTML are flushed/fsynced; manifest hashes every other member; current.json and the receipt anchor manifest hash and byte size after the run directory rename. Cache markers and trend-source records are idempotent post-publication projections; trend.jsonl is atomically rebuilt from the ledger."
crash_windows = "A crash before current-pointer replacement leaves the prior generation current and leased staging unreferenced; after replacement it exposes one root-verified generation. Cache/trend projection failure leaves the report factual, cache uncommitted and a receipt gap for reconciliation. Publication failure writes one typed receipt-bound fallback; active leases prevent cleanup."
corrupt_predecessor = "Corrupt predecessor state fails closed under the publication lock: malformed, oversized, symlinked, path-escaping, missing-generation, identity, root or member mismatch is quarantined or yields exact inspect and dry-run/apply repair commands. An absent first pointer is valid; corrupt cache is a miss; corrupt trend rebuilds from the 400-day source ledger."
partial_results = "Every selected mutant receives exactly one closed terminal status plus mutation-applied and test-started facts. Deadline, signal, baseline and worker degradation publish a marked partial generation when possible. Projection degradation remains visible in the receipt without rewriting report truth; publication failure preserves staging and writes a typed bounded fallback."
reader_consistency = "Readers resolve one receipt/current pointer, verify its manifest root then member hashes, and read one immutable generation. Cache readers require closure identity and commit marker; trend readers validate compact source records and expose gaps instead of treating a truncated projection as complete."
backup_hash_verification = "Report recovery verifies manifest SHA-256/size from receipt/current and every member hash before publication and CI upload. Cache markers and compact trend-source records are read-back hashed; disposable ignored developer state requires no business-data backup or restore path."
small_sample_verification = "Temporary-root tests interrupt receipt/report/pointer/cache-marker/trend-source/projection phases, race leases/same-key writers, corrupt every pointer/root/ledger state, and verify one predecessor/successor. They exercise inspect/repair, redaction, retention, closed algebra, projection gaps, 400-day rebuild and lowered-budget root hashes."
rollback = "Rollback removes tracked workflow, controller, configuration and documentation without mutating runtime data. Ignored report generations, caches and trend records remain available for manual audit and can be deleted separately; no rollback rewrites current.json to fabricate an older result or imports developer state into production."
audit_trail = "The invocation receipt and immutable manifest record run_id, monotonic deadline, UTC timestamps, mode, commit/dirty-tree identity, target base, config/tool/environment/execution/comparison/cohort digests, budgets, stop/status, hashes, pass-FD policy, child guard lifecycle, controller syscall-audit lifecycle and violations, cancellation, redaction, cache commit, retention, pointer recovery and trend projection decisions without credentials or production data."

[evidence.concurrency]
ownership = "One stdlib supervisor creates the receipt/deadline before uv, owns uv sessions, subreaper/cgroup cleanup and signal forwarding; one controller owns planning, bounded threads, direct pytest Popen, the seccomp user-notification listener, syscall decisions/audit, and a synchronized PGID/per-mutant transition registry. Each thread owns one bytecode-clean closure tree; the worker installs Landlock plus seccomp before application code, passes only the reviewed listener/receipt descriptors, and closes every other inherited descriptor."
bound = "Mode limits are 150/1000/5000 selected mutants and 600/1800/5400 hard wall seconds with 30/60/120 in-budget reserves; scans are 3000/20000/100000 candidates and 3/20/100 million visits; source/dependency limits are finite; each tree is 512 files/8 MiB/10 seconds, aggregate 2048/32 MiB with 512 MiB free; workers are CPU and cgroup-memory bounded, max four, native threads one; every output/generation/cache/trend-source/projection dimension is numeric."
ordering = "Planning order is changed line, changed definition, configured core/defect priority, then repository-relative path, line, column, operator priority/name and occurrence. Completion order never changes serialized report order."
atomicity = "Threads share no mutable tree. One operator-local span-verified mutation is applied to one closure tree. JSON/Markdown/HTML plus non-self manifest publish under one leased run ID and root-hashed pointer; cache commit and trend-source append happen after publication; fallback never changes current."
timeout_cancellation = "Baseline/mutant pytest start in controller-owned groups; each mutant atomically linearizes natural exit versus cancel. Admission requires timeout plus reap before execution deadline. Controller sends TERM/KILL; supervisor subreaper/cgroup adopts cleanup after controller death. Timeout, cancellation and infrastructure remain distinct."
backpressure = "Admission uses the lower CPU/cgroup-memory worker bound with native threads one, a finite queue, deadline checks during Git/source/AST/dependency/copy/coverage, cleanup/report reserve and worst-case report capacity. Cold core/full qualification and bounded CI storage are required before schedules."
partial_failure = "Baseline failure marks only its tuple unavailable. The closed terminal enum and phase facts keep fresh/cache kills/survivors, no-coverage, invalid, timeout, infrastructure, guard failure, cancellation and not-run distinct. Completed exits win races when observed first; projection failure never rewrites report truth."
capacity_validation = "Tests force source/AST/closure/visit/candidate/mutant/tree/temp/native-thread/cgroup-memory/time/detail/generation/ledger/cache ceilings, 10x unrelated-module cache reuse, pre-uv deadline, controller SIGKILL/OOM, cgroup/subreaper cleanup, exit-cancel races, exact pass-FD closure, native open/network/fork/exec/process-clone denial, reviewed thread-clone allowance, both authenticated guard/audit lifecycles, redaction and interruption."

[[obligations]]
id = "mutation.bounded-execution"
owner = "trade_py/devtools/mutation_testing supervisor, selection, process supervisor and scheduler"
paths = [
  "scripts/mutation-test",
  "trade_py/devtools/mutation_testing/supervisor.py",
  "trade_py/devtools/mutation_testing/bootstrap.py",
  "trade_py/devtools/mutation_testing/config.py",
  "trade_py/devtools/mutation_testing/git_scope.py",
  "trade_py/devtools/mutation_testing/selection.py",
  "trade_py/devtools/mutation_testing/process_supervisor.py",
  "trade_py/devtools/mutation_testing/executor.py",
  "config/mutation-testing.toml",
  "tests/test_mutation_selection.py",
  "tests/test_mutation_executor.py",
]
contracts = [
  "changed 150 mutants and 600 seconds",
  "core 1000 mutants and 1800 seconds",
  "full 5000 mutants and 5400 seconds",
  "worker max min(4, CPU half) plus cgroup memory",
  "one native thread per pytest process",
  "finite source, AST, dependency, visit, private-tree and candidate scan",
  "one stdlib supervisor deadline before uv plus execution deadline and in-budget reserve",
  "subreaper and optional invocation cgroup cleanup after controller death",
  "lowering-only overrides and no scope broadening",
]
failure_states = [
  "unresolved base",
  "candidate or mutant budget exhausted",
  "global deadline",
  "controller SIGKILL or OOM",
  "unsafe or excluded source",
  "excessive worker request",
  "partial execution",
  "source or dependency capacity refusal",
  "private-tree or report capacity refusal",
]
spec_requirements = [
  "controlled-mutation-testing:Mutation execution SHALL be bounded by mode",
  "controlled-mutation-testing:Mutation target and test selection SHALL remain narrow",
]
validation_tasks = ["1.1", "1.2", "2.2", "2.3", "4.1", "4.2", "4.4"]

