  "config/mutation-testing.toml",
  "config/mutation-capacity.json",
  "tests/test_mutation_selection.py",
  "tests/test_mutation_executor.py",
]
contracts = [
  "changed 150 mutants and 600 seconds",
  "core 1000 mutants and 1800 seconds",
  "full 5000 mutants and 5400 seconds",
  "worker max min(4, CPU half) plus tuple-specific finite cgroup memory",
  "no finite enforceable memory forces one local worker and rejects CI execution",
  "one native thread per pytest process",
  "finite source, AST, dependency, visit, private-tree and candidate scan",
  "one Python 3.7 stdlib supervisor deadline before uv plus execution deadline and in-budget reserve",
  "fork-stop cgroup admission, pidfd identity and supervisor cleanup/fallback after controller death",
  "outer CI timeout contains uninterruptible kernel or filesystem stalls",
  "lowering-only overrides and no scope broadening",
]
failure_states = [
  "unresolved base",
  "candidate or mutant budget exhausted",
  "global deadline",
  "controller SIGKILL or OOM",
  "cleanup unconfirmed or fsync unreturned",
  "missing, stale or identity-mismatched capacity qualification",
  "no finite enforceable CI memory bound",
  "unsafe or excluded source",
  "excessive worker request",
  "partial execution",
  "source or dependency capacity refusal",
  "private-tree or report capacity refusal",
]
spec_requirements = [
  "controlled-mutation-testing:Mutation execution SHALL be bounded by mode",
  "controlled-mutation-testing:Mutation target and test selection SHALL remain narrow",
]
validation_tasks = ["1.1", "1.2", "2.2", "2.3", "2.6", "2.8", "4.1", "4.2", "4.4"]

