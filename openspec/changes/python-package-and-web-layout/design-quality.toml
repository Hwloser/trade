schema_version = 1
policy_version = "v1"

[[impacts]]
id = "public_contract"
applies = true
reason = "The child governs the installed distribution and import namespaces, root and console entrypoints, ASGI/reload/child module strings, HTTP/Web asset contracts, SDK/notebook import surface and optional native module identity while requiring compatibility through staged authority transfer."

[[impacts]]
id = "persistent_write"
applies = false
reason = "Package builds, wheel manifests, Web builds and validation reports are developer or CI artifacts only; the child introduces no runtime database, parquet, manifest, catalog, pointer, outbox, cache or business-artifact writer and all tests use temporary roots."

[[impacts]]
id = "schema_migration"
applies = false
reason = "No database table, column, index, migration version, parquet layout, runtime manifest or public business payload schema changes; existing destructive scripts remain inert and blocked until their owning migration changes."

[[impacts]]
id = "point_in_time"
applies = false
reason = "Notebook and SDK checks preserve existing immutable snapshot identity and explicit knowledge policy but do not define or alter clock, revision, PIT resolution, eligibility, release or restatement semantics."

[[impacts]]
id = "predictive_model"
applies = false
reason = "No feature, label, model, forecast, recommendation, ranking, calibration, StudyResult, promotion or decision-support behavior is trained, changed, served or reinterpreted."

[[impacts]]
id = "external_event_data"
applies = false
reason = "No provider, news, social, macro, on-chain or third-party event interaction, source policy, payload, correction, replay, licensing, quota or network behavior changes; source audit and tests are offline."

[[impacts]]
id = "runtime_concurrency"
applies = true
reason = "ASGI reload and runtime child modules are imported in independent processes, Web resources and force-exit behavior must retain one shutdown owner, and build/install/import/native/browser validation must use bounded terminable process groups without leaving residual workers."

[evidence.contract]
contract = "The governed contract keeps distribution `trade-py`, existing `trade_py` imports, root `./trade`, installed `trade-py`, `trade_web:create_app`, reviewed backend imports, HTTP route/OpenAPI/payload/error/SSE/capability behavior, Web asset and proxy semantics, installed SDK/notebook behavior and optional native capability while adding `trade` and `_trade_native` only through explicit versioned migration generations."
consumers = "Repository developers, installed CLI users, Uvicorn factory/reload workers, runtime command child processes, FastAPI/React clients, SDK and notebook users, scheduler/event/import adapters, package/build tooling, CMake/native adapters, pytest/Vitest/Playwright/ctest and deployment documentation consume these names or paths."
compatibility = "Every existing public command, import, ASGI string, URL, method, parameter, status, header, payload, SSE frame, capability mode, Web route, asset URL and component test runner remains compatible until its owning child explicitly versions it. Legacy paths forward only to one target authority; target code never depends on legacy implementation."
migration = "First prove source/editable/clean-wheel dual discovery and authority guards; then isolate `_trade_native`; then migrate only owner-ready bounded Python slices; then installed SDK/notebook, owner-ready ASGI/BFF/Bootstrap and the Vite workspace. Each slice keeps the old path and independent rollback selector for at least the compatibility window."
rollback = "Select and reinstall the immediately preceding package, ASGI, Web-build or native generation, restore the prior authority/forwarding state, rerun its contract matrix and retain every database and immutable business artifact. A failed slice never requires reverting earlier semantic Context migrations."

[evidence.concurrency]
ownership = "Package validation owns only its spawned build/install/import/console processes and temporary environments; Uvicorn owns server worker/reload processes; Bootstrap remains the sole target runtime composition owner; WebResourceContainer remains the current command/EventBus/DB shutdown owner until its approved Bootstrap migration; each Context native adapter owns its optional `_trade_native` call behind a Port."
bound = "One module-authority slice is capped at 50 production modules and 500 consumer records. Paths are sorted and never sampled or silently truncated. At most two isolated install environments run concurrently. Default reviewed subprocess budgets are five minutes per package smoke, ten minutes per native build smoke and fifteen minutes per Web build/test smoke, with smaller task-specific deadlines where measured baselines permit."
ordering = "Freeze the tracked consumer inventory and prerequisite SHAs, prove the target build in shadow mode, verify source/editable/wheel or old/new Web/native parity, install an explicit legacy-to-target forwarder, activate one target authority, observe the compatibility window, and only then hand retirement to cleanup. Runtime shutdown continues to close command and EventBus admission before draining work and closing the DB."
atomicity = "A migration generation is admitted only when all required build, import, contract and rollback evidence for that slice passes. No partial wheel, target source copy, incomplete Web build or native artifact changes authority. Exactly one implementation and one runtime lifecycle owner are visible per logical module/generation."
timeout_cancellation = "Every build, install, import, console, ASGI, browser and native check runs with a finite monotonic deadline in an owned process group. Timeout terminates graceful then forced process-tree cleanup, records `timeout` separately from test or tool failure, retains completed evidence and never advances authority. Layout movement preserves current Web shared-deadline and force-exit behavior."
backpressure = "Inventory and consumer caps reject oversized slices and require deterministic subdivision. Validation uses no unbounded work queue; at most two install environments are active and one migration generation per logical module may be under activation."
partial_failure = "A failed package member/origin check, duplicate module owner, route/SSE/asset mismatch, reload/child import failure, native differential mismatch, notebook prohibition, unknown consumer or incomplete cleanup leaves the prior generation authoritative. Tool failure, unavailable prerequisite, timeout and contract mismatch remain distinct report states."
capacity_validation = "Fixtures exercise exact 50/500 limits and one-over refusal, deterministic ordering, source/editable/clean-wheel isolation, import-order and concurrent import identity, duplicate registry/resource detection, two-install concurrency, hung process-tree cleanup, ASGI reload/child import, blocked Web shutdown, manifest asset completeness and optional native absent/present behavior. Ten-times-current candidate input must fail closed into smaller slices rather than truncate."

