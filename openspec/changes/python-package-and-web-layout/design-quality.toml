  "tests/contract/",
]
contracts = [
  "distribution trade-py and installed trade_py compatibility",
  "installed trade target namespace",
  "root ./trade and trade-py console parity",
  "one implementation authority per logical module",
  "source, editable and clean-wheel member/origin evidence",
  "digest-bound consumer inventory, activation plan and migration evidence",
  "read-only typed layout status",
  "measured compatibility bridge retirement",
]
failure_states = [
  "target package missing from wheel",
  "checkout path hides installation failure",
  "unexpected wheel member",
  "duplicate module or import-time side effect",
  "target-to-legacy implementation dependency",
  "stale or over-budget consumer inventory",
  "uncorrelated activation evidence",
  "selector compare-and-set conflict",
  "status axes conflate failure and rollback",
